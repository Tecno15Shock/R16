<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 Clientes y Fiados | Panel Administrativo</title>
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Fuentes Ultra-Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================================= */
        /* VARIABLES DE ESTILO PREMIUM (CARMESÍ, DORADO Y FONDO CLARO)*/
        /* ========================================================= */
        :root {
            --active-gold: #D4AF37; 
            
            --primary: #3b0918; 
            --secondary: #7c1126; 
            --crimson-dark: #4A0E12;
            
            --bg: #FDFBF7; 
            --text: #2A2A2A; 
            --muted: #555555;
            --border: #E8E0D5; 
            --card-bg: #FFFFFF; 
            --item-bg: #FCFBFA; 
            
            --danger: #8B0000; 
            --success: #2E7D32; 
            --warning: #B8860B; 
            --info: #2c3e50;
            --input-bg: #FAFAFA;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.5; scroll-behavior: smooth; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .wrapper { display: block; min-height: 100vh; position: relative; padding: 40px 20px 100px 20px; max-width: 1100px; margin: 0 auto; }

        /* ========================================================= */
        /* BOTÓN X FLOTANTE CON FONDO BLANCO                         */
        /* ========================================================= */
        .close-corner-btn {
            position: fixed; top: 20px; right: 25px; z-index: 10000;
            background: #FFFFFF; backdrop-filter: blur(8px);
            border: 2px solid var(--active-gold); color: var(--primary);
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem; font-weight: bold; cursor: pointer; text-decoration: none;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .close-corner-btn:hover { background: var(--primary); color: #FFFFFF; transform: scale(1.1) rotate(90deg); }

        /* ========================================================= */
        /* CONTENEDORES Y ACORDEÓN DESPLEGABLE LUXURY                */
        /* ========================================================= */
        .main-content { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .card { 
            background: var(--card-bg); border-radius: 8px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
            position: relative; overflow: hidden;
            transition: background 0.3s;
        }
        
        /* Cabecera del Acordeón */
        .card-header {
            padding: 20px 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            transition: filter 0.3s ease; user-select: none; border-bottom: 2px solid var(--border);
        }
        .card-header:hover { filter: brightness(1.15); }
        .card-header h2 { 
            color: var(--active-gold); margin: 0; font-size: 1.25rem; font-family: 'Playfair Display', serif; 
            text-transform: uppercase; letter-spacing: 1.5px; border: none; padding: 0; display: flex; align-items: center; gap: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }
        .accordion-icon {
            font-size: 1.2rem; color: var(--active-gold); font-weight: bold; transition: transform 0.3s ease; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Cuerpo del Acordeón */
        .card-body {
            max-height: 0; overflow: hidden; padding: 0 25px; opacity: 0;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), padding 0.3s ease, opacity 0.3s ease;
            background: var(--card-bg); 
        }
        .card.open .card-body {
            max-height: 2500px; padding: 25px; opacity: 1;
            transition: max-height 0.6s ease-in-out, padding 0.3s ease, opacity 0.4s ease;
        }
        .card.open .accordion-icon { transform: rotate(180deg); }

        h4 { color: var(--primary); margin-top: 15px; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-family: 'Playfair Display', serif; text-transform: uppercase; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        
        label { font-size: 0.85rem; font-weight: bold; display: block; margin-top: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            width: 100%; padding: 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 4px; 
            font-size: 1rem; background: var(--input-bg); transition: all 0.3s ease; color: var(--text); border-left: 4px solid #DDD; font-family: 'Roboto', sans-serif;
        }
        input:focus, select:focus { outline: none; background: #FFF; border-color: var(--active-gold); border-left: 4px solid var(--active-gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.25); }

        button { font-family: 'Roboto', sans-serif; border: none; padding: 12px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 0.95rem; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        button:active { transform: scale(0.98); }
        
        .btn-info { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--active-gold); border: 1px solid var(--active-gold); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-success { background: var(--success); color: white; }

        .pending-header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            padding: 25px; border-radius: 8px; text-align: center; border: 2px solid var(--active-gold); 
            margin-bottom: 20px; font-size: 1.1rem; font-weight: bold; color: var(--active-gold); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 1px;
        }
        .pending-header span { font-size: 2.2rem; color: #ffffff; display: block; margin-top: 5px; text-shadow: 1px 1px 4px rgba(0,0,0,0.3); }
        
        .zebra-item { border-bottom: 1px solid var(--border); padding: 18px; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); transition: background 0.3s; }
        .zebra-item:nth-child(even) { background: var(--item-bg); }
        .zebra-item:hover { background: rgba(212, 175, 55, 0.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; border: 1px solid var(--border); }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        th { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: var(--active-gold); font-family: 'Playfair Display', serif; border-color: var(--active-gold); }

        /* ========================================================= */
        /* MODALES Y PANTALLA DE BLOQUEO INTELIGENTE                 */
        /* ========================================================= */
        #loading_overlay, #pantalla_bloqueo_admin {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(74, 14, 18, 0.95), rgba(5, 5, 5, 0.98));
            z-index: 99999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 100000; display: none; align-items: center; justify-content: center; animation: fadeIn 0.25s ease-in-out; }
        .custom-modal-box { background: var(--card-bg); padding: 30px; border-radius: 8px; width: 90%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 2px solid var(--active-gold); }
        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: var(--primary); color: var(--active-gold); border: 1px solid var(--active-gold); border-radius: 50%; width: 34px; height: 34px; font-weight: bold; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; font-family: Arial, sans-serif; padding:0; margin:0;}
        .modal-close-btn:hover { background: var(--danger); transform: scale(1.05); color: #FFF; }
        .custom-modal-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 20px; font-weight: bold; border-bottom: 2px solid var(--active-gold); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        #global_modal_body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }

        .spinner-luxury {
            width: 50px; height: 50px; border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--active-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 25px auto;
        }

        .badge-nivel {
            display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 12px;
            background: rgba(212, 175, 55, 0.15); color: var(--active-gold); border: 1px solid var(--active-gold);
        }
    </style>
</head>
<body>

<!-- BOTÓN X FLOTANTE CON FONDO BLANCO -->
<a href="principal.html" class="close-corner-btn" title="Volver al Menú Principal">✕</a>

<!-- MODAL DE CARGA INICIAL -->
<div id="loading_overlay">
    <div class="card" style="width: 380px; text-align: center; border-top: 4px solid var(--active-gold); box-shadow: 0 25px 60px rgba(0,0,0,0.8); background: #FFFFFF; margin:0;">
        <div class="spinner-luxury"></div>
        <h2 style="color: var(--primary); border: none; font-size: 1.2rem; margin-bottom:5px;">Sincronizando Módulo</h2>
        <p style="font-size: 0.9rem; color: var(--muted); font-family: 'Playfair Display', serif; font-style: italic;">Cargando cartera de clientes y cuentas...</p>
    </div>
</div>

<!-- 🔒 PANTALLA DE BLOQUEO INTELIGENTE POR NIVELES -->
<div id="pantalla_bloqueo_admin" style="display: none;">
    <div class="card" style="width: 380px; text-align: center; border-top: 4px solid var(--active-gold); margin: 0; box-shadow: 0 25px 60px rgba(0,0,0,0.8); background: #FFFFFF;">
        <h2 style="color: var(--primary); border-bottom-color: var(--active-gold);">🔒 Módulo Protegido</h2>
        <div id="info_nivel_bloqueo" class="badge-nivel">Verificando nivel de acceso...</div>
        <p style="font-size: 0.95rem; color: var(--muted); margin-bottom: 20px;">Introduce la credencial o PIN correspondiente:</p>
        
        <div style="position: relative; margin-bottom: 20px;">
            <input type="password" id="pin_ingreso_body" placeholder="••••" style="text-align: center; font-size: 1.8rem; letter-spacing: 8px; width: 100%; padding-right: 45px; margin-top: 0; font-family: 'Courier New', Courier, monospace;" onkeyup="if(event.key==='Enter') verificarPinInteligente()">
            <span id="icono_ojo_pin" onclick="toggleVerPin()" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.3rem;">👁️</span>
        </div>

        <button id="btn_desbloquear_pin" class="btn-info" onclick="verificarPinInteligente()" style="margin-top: 0; padding: 14px; font-size: 1rem; letter-spacing: 1.5px;">Desbloquear Pantalla</button>
        <button id="btn_volver_pin" class="btn-danger" onclick="window.location.href='principal.html'" style="margin-top: 10px; padding: 12px; font-size: 0.95rem; width: 100%;">Volver al Inicio</button>
    </div>
</div>

<!-- MODAL GLOBAL -->
<div id="global_modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <button class="modal-close-btn" onclick="cerrarModalGlobal()">✕</button>
        <div id="global_modal_title" class="custom-modal-title">Título</div>
        <div id="global_modal_body"></div>
    </div>
</div>

<div class="wrapper">
    <div class="main-content">
        <!-- ESTADÍSTICA PRINCIPAL -->
        <div class="pending-header">
            TOTAL CAPITAL POR COBRAR (CALLE)
            <span id="tot_pendiente_clientes">$0.00</span>
        </div>

        <!-- ACORDEÓN ÚNICO: CARTERA DE CLIENTES -->
        <div class="card open" style="border-top: 4px solid var(--active-gold);">
            <div class="card-header" onclick="toggleAcordeon(this)">
                <h2>👥 Registro de Clientes y Fiados</h2>
                <span class="accordion-icon" style="transform: rotate(180deg);">▼</span>
            </div>
            <div class="card-body" style="max-height: 5000px; padding: 25px; opacity: 1;">
                
                <div class="grid-2" style="align-items: center; margin-bottom: 20px;">
                    <div>
                        <input type="text" id="buscar_cliente" placeholder="🔍 Buscar cliente por nombre o cédula..." oninput="renderClientes()" style="margin-top:0;">
                    </div>
                    <div>
                        <button class="btn-info" onclick="abrirModalNuevoCliente()" style="margin-top:0;">➕ AÑADIR CLIENTE NUEVO</button>
                    </div>
                </div>

                <div id="lista_clientes_container" style="border: 1px solid var(--border); border-radius: 4px; overflow: hidden;">
                    <!-- Se inyecta dinámicamente -->
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const SUPABASE_URL = 'https://khazglefhixcdynrdixj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__ysP-HoZp2sWZLqQfnDOAg_zcTQSV3i';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let CURRENT_LOCAL_ID = null;
    let CONFIG_GLOBAL = {};
    let CONFIG_GLOBAL_MODULOS = {};
    let ADMIN_PASS_DB = '151016';
    let CLIENTES = [];
    let CATALOGO = [];
    let EMPLEADOS = [];

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const { data } = await supabaseClient.auth.getSession();
            if (!data || !data.session) {
                alert("No hay una sesión activa.");
                window.location.href = 'index.html';
                return;
            }
            await inicializarDatos(data.session.user.id);
        } catch (err) { 
            console.error(err);
            alert("Error de red conectando con el servidor.");
        }
    });

    function toggleAcordeon(header) {
        let card = header.parentElement;
        let icon = header.querySelector('.accordion-icon');
        card.classList.toggle('open');
        if (card.classList.contains('open')) {
            icon.style.transform = "rotate(180deg)";
        } else {
            icon.style.transform = "rotate(0deg)";
        }
    }

    function toggleVerPin() {
        let input = document.getElementById('pin_ingreso_body');
        let icono = document.getElementById('icono_ojo_pin');
        if (input.type === 'password') {
            input.type = 'text';
            icono.innerText = '🙈';
        } else {
            input.type = 'password';
            icono.innerText = '👁️';
        }
    }

    async function inicializarDatos(userId) {
        let { data: perfil } = await supabaseClient.from('perfiles').select('local_id, nombre').eq('id', userId).single();
        if (perfil && perfil.local_id) {
            CURRENT_LOCAL_ID = perfil.local_id;
            
            let conf = null, localData = null;
            try {
                let resConf = await supabaseClient.from('configuraciones').select('*').eq('local_id', CURRENT_LOCAL_ID).maybeSingle();
                conf = resConf.data;
            } catch(e) { console.warn("Sin configuración propia"); }

            try {
                let resLocal = await supabaseClient.from('locales').select('nombre, password_admin').eq('id', CURRENT_LOCAL_ID).maybeSingle();
                localData = resLocal.data;
            } catch(e) { console.warn("Sin local asociado"); }

            if (conf) {
                CONFIG_GLOBAL = conf;
                if(conf.identidad && conf.identidad.admin_pass) ADMIN_PASS_DB = conf.identidad.admin_pass;
                if(conf.permisos_modulos) CONFIG_GLOBAL_MODULOS = conf.permisos_modulos;
            }

            if (localData && localData.password_admin) {
                ADMIN_PASS_DB = localData.password_admin;
            }

            let nombreLocal = localData?.nombre || CONFIG_GLOBAL.identidad?.nombre || 'Sistema';
            
            const subContainer = document.querySelector('.main-content');
            if (subContainer) {
                let pLocal = document.createElement('div');
                pLocal.style.textAlign = 'center';
                pLocal.style.marginBottom = '10px';
                pLocal.innerHTML = `<h1 style="font-family: 'Playfair Display', serif; color: var(--primary); margin: 0; font-size: 1.8rem; text-transform: uppercase;">👥 Clientes y Fiados</h1><p style="color: var(--muted); font-size: 0.95rem; margin-top: 5px; font-weight: 500; font-family: 'Playfair Display', serif; font-style: italic;">🏪 ${nombreLocal}</p>`;
                subContainer.insertBefore(pLocal, subContainer.firstChild);
            }
        } else {
            return alert("Error: Perfil no vinculado a un local.");
        }

        await cargarDatosSupabase();

        setTimeout(() => {
            document.getElementById('loading_overlay').style.display = 'none';
            evaluarSistemaBloqueoInteligente();
        }, 800);
    }

    // ==========================================
    // SISTEMA DE BLOQUEO INTELIGENTE POR NIVELES
    // ==========================================
    function evaluarSistemaBloqueoInteligente() {
        const permisosMod = CONFIG_GLOBAL_MODULOS['clientes'] || { general: true, admin: true, sup: false, vend: false };
        
        let estaBloqueado = false;
        let nivelRequeridoTexto = "Acceso Libre / General";

        if (permisosMod.general) {
            estaBloqueado = true;
            if (permisosMod.admin) nivelRequeridoTexto = "👑 Nivel Administrador Requerido";
            else if (permisosMod.sup) nivelRequeridoTexto = "👁️ Nivel Supervisor Requerido";
            else if (permisosMod.vend) nivelRequeridoTexto = "🛒 Nivel Vendedor Requerido";
            else nivelRequeridoTexto = "🔒 Módulo Bloqueado General";
        }

        if (estaBloqueado) {
            document.getElementById('info_nivel_bloqueo').innerText = nivelRequeridoTexto;
            document.getElementById('pantalla_bloqueo_admin').style.display = 'flex';
            document.getElementById('pin_ingreso_body').focus();
        } else {
            document.getElementById('pantalla_bloqueo_admin').style.display = 'none';
        }
    }

    async function verificarPinInteligente() {
        let pinIngresado = document.getElementById('pin_ingreso_body').value.trim();
        let btn = document.getElementById('btn_desbloquear_pin');
        let supervisorValido = EMPLEADOS.some(e => (e.rol === 'Administrador' || e.rol === 'Supervisor') && (e.pin_acceso === pinIngresado || e.pin === pinIngresado));

        btn.innerHTML = "⏳ Verificando acceso...";
        btn.disabled = true;

        await new Promise(resolve => setTimeout(resolve, 600));

        if (pinIngresado === ADMIN_PASS_DB || supervisorValido) {
            let pantalla = document.getElementById('pantalla_bloqueo_admin');
            pantalla.style.animation = 'fadeIn 0.3s reverse';
            setTimeout(() => {
                pantalla.style.display = 'none';
                btn.innerHTML = "Desbloquear Pantalla";
                btn.disabled = false;
            }, 250);
        } else {
            alert("❌ PIN Incorrecto. Autorización denegada para este nivel.");
            document.getElementById('pin_ingreso_body').value = '';
            btn.innerHTML = "Desbloquear Pantalla";
            btn.disabled = false;
        }
    }

    async function cargarDatosSupabase() {
        const [reqCli, reqCat, reqEmp] = await Promise.all([
            supabaseClient.from('clientes').select('*').eq('local_id', CURRENT_LOCAL_ID),
            supabaseClient.from('catalogo').select('*').eq('local_id', CURRENT_LOCAL_ID),
            supabaseClient.from('empleados').select('*').eq('local_id', CURRENT_LOCAL_ID)
        ]);

        if (reqCli.data) {
            CLIENTES = reqCli.data.map(c => ({ 
                id: c.id, 
                nom: c.nombre, 
                ced: c.cedula || '', 
                dir: c.direccion || '', 
                deudaUsd: parseFloat(c.deuda_usd) || 0, 
                historial: c.historial || []
            })).sort((a, b) => a.nom.localeCompare(b.nom));
        }

        if (reqCat.data) {
            CATALOGO = reqCat.data.map(p => ({
                uuid: p.id, 
                nom: p.nombre, 
                stock: p.stock || 0, 
                base: p.precio_base || 0, 
                ventaRef: p.precio_venta || 0
            }));
        }

        if (reqEmp.data) {
            EMPLEADOS = reqEmp.data;
        }

        renderClientes();
    }

    function renderClientes() {
        let q = document.getElementById('buscar_cliente').value.toLowerCase();
        let html = "";
        let filtrados = CLIENTES.filter(c => c.nom.toLowerCase().includes(q) || c.ced.toLowerCase().includes(q));

        if (filtrados.length === 0) {
            html = '<div style="padding: 30px; text-align: center; color: var(--muted); background: var(--item-bg); font-style: italic;">No se encontraron registros de clientes.</div>';
        } else {
            filtrados.forEach((c) => {
                html += `
                <div class="zebra-item">
                    <div style="flex:1;">
                        <strong style="font-size: 1.1rem; color: var(--primary); font-family: 'Playfair Display', serif;">${c.nom}</strong><br>
                        <small style="color: var(--muted);">C.I: <strong>${c.ced || 'N/A'}</strong> | Dirección: <strong>${c.dir || 'N/A'}</strong></small>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
                        <span style="color:var(--danger); font-weight:bold; font-size:1.4rem; font-family: 'Playfair Display', serif;">$${c.deudaUsd.toFixed(2)}</span>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-info" style="padding:6px 10px; margin:0; width:auto; border-radius:4px;" onclick="editarCliente('${c.id}')" title="Editar">✏️</button>
                            <button class="btn-warning" style="padding:6px 12px; margin:0; width:auto; border-radius:4px;" onclick="gestionarCuentaCliente('${c.id}')">⚙️ GESTIÓN DE CUENTA</button>
                            <button class="btn-danger" style="padding:6px 10px; margin:0; width:auto; border-radius:4px;" onclick="eliminarClienteSupabase('${c.id}')" title="Eliminar">🗑️</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        document.getElementById('lista_clientes_container').innerHTML = html;
        
        let tC = CLIENTES.reduce((acc, c) => acc + (c.deudaUsd || 0), 0);
        document.getElementById('tot_pendiente_clientes').innerText = `$${tC.toFixed(2)}`;
    }

    function abrirModalNuevoCliente() {
        abrirModalGlobal("👤 Añadir Cliente Nuevo", `
            <div class="grid-2">
                <div><label>Nombres y Apellidos:</label><input type="text" id="c_nom" placeholder="Ej: Juan Pérez"></div>
                <div><label>Cédula de Identidad:</label><input type="text" id="c_ced" placeholder="Ej: 12345678"></div>
            </div>
            <label>Dirección Física:</label><input type="text" id="c_dir" placeholder="Referencia de ubicación...">
            
            <button class="btn-info" onclick="guardarClienteNuevo()" style="margin-top: 25px;">💾 REGISTRAR CLIENTE</button>
            <button class="btn-warning" style="margin-top: 10px;" onclick="cerrarModalGlobal()">CANCELAR</button>
        `);
    }

    async function guardarClienteNuevo() {
        let n = document.getElementById('c_nom').value.trim();
        let c = document.getElementById('c_ced').value.trim();
        let d = document.getElementById('c_dir').value.trim();
        if (!n) return alert("⚠️ El nombre del cliente es obligatorio.");

        let payload = { local_id: CURRENT_LOCAL_ID, nombre: n, cedula: c, direccion: d, deuda_usd: 0, historial: [] };
        mostrarModalLocal("Guardando", "Almacenando ficha en la base de datos...");
        try {
            await supabaseClient.from('clientes').insert([payload]);
            await cargarDatosSupabase();
            cerrarModalGlobal();
        } catch(err) { cerrarModalGlobal(); alert("Error: " + err.message); }
    }

    function editarCliente(id) {
        let cli = CLIENTES.find(c => c.id === id); if(!cli) return;
        abrirModalGlobal("✏️ Editar Perfil de Cliente", `
            <div class="grid-2">
                <div><label>Nombres y Apellidos:</label><input type="text" id="edit_c_nom" value="${cli.nom}"></div>
                <div><label>Cédula de Identidad:</label><input type="text" id="edit_c_ced" value="${cli.ced}"></div>
            </div>
            <label>Dirección Física:</label><input type="text" id="edit_c_dir" value="${cli.dir}">
            
            <button class="btn-info" onclick="guardarEdicionCliente('${id}')" style="margin-top: 25px;">💾 ACTUALIZAR DATOS</button>
            <button class="btn-warning" style="margin-top: 10px;" onclick="cerrarModalGlobal()">CANCELAR</button>
        `);
    }

    async function guardarEdicionCliente(id) {
        let n = document.getElementById('edit_c_nom').value.trim();
        let c = document.getElementById('edit_c_ced').value.trim();
        let d = document.getElementById('edit_c_dir').value.trim();
        if(!n) return alert("⚠️ El nombre no puede estar vacío.");

        mostrarModalLocal("Actualizando", "Guardando modificaciones...");
        try {
            await supabaseClient.from('clientes').update({ nombre: n, cedula: c, direccion: d }).eq('id', id);
            await cargarDatosSupabase();
            cerrarModalGlobal();
        } catch(err) { cerrarModalGlobal(); alert("Error: " + err.message); }
    }

    async function eliminarClienteSupabase(id) {
        if(!confirm("⚠️ ADVERTENCIA CRÍTICA: ¿Estás seguro de eliminar este cliente del sistema?\n\nSe perderá su registro y todas las deudas asociadas de forma irreversible.")) return;
        mostrarModalLocal("Eliminando", "Borrando ficha y deudas...");
        try {
            await supabaseClient.from('clientes').delete().eq('id', id);
            await cargarDatosSupabase();
            cerrarModalGlobal();
        } catch(err) { cerrarModalGlobal(); alert("Error: " + err.message); }
    }

    function gestionarCuentaCliente(id) {
        let cli = CLIENTES.find(c => c.id === id); if(!cli) return;
        
        let optCatalogo = CATALOGO.map(p => `<option value="${p.uuid}" data-venta="${p.ventaRef}" data-caja="${p.base}">[Stock: ${p.stock}] ${p.nom}</option>`).join('');

        let html = `
            <div style="text-align:center; margin-bottom: 20px; font-size:1.2rem; background: var(--item-bg); padding: 15px; border-radius: 4px; border: 1px solid var(--border);">
                Balance Pendiente Actual: <strong style="color:var(--danger); font-size: 1.8rem; font-family: 'Playfair Display', serif; display: block; margin-top: 5px;">$${cli.deudaUsd.toFixed(2)}</strong>
            </div>
            
            <button class="btn-success" style="width:100%; margin-bottom:20px; margin-top:0;" onclick="generarPDFEstadoCuenta('${id}')">📄 GENERAR ESTADO DE CUENTA (PDF FORMAL)</button>
            
            <div style="background:var(--card-bg); padding:20px; border:1px solid var(--border); border-radius:4px; margin-bottom:15px;">
                <h4 style="margin:0 0 15px 0;">📦 1. Cargar Deuda con Inventario Físico</h4>
                <div class="grid-2">
                    <div>
                        <label style="margin-top:0;">Seleccionar Mercancía:</label>
                        <select id="gc_prod_id"><option value="">Seleccione un producto...</option>${optCatalogo}</select>
                    </div>
                    <div>
                        <label style="margin-top:0;">Cantidad (Unidades):</label>
                        <input type="number" id="gc_prod_cant" placeholder="Ej: 1" value="1">
                    </div>
                </div>
                <div class="grid-2" style="margin-top:12px;">
                    <div>
                        <label style="margin-top:0;">Tarifa a Aplicar:</label>
                        <select id="gc_prod_tipo"><option value="venta">Precio Público</option><option value="caja">Precio Interno (Base)</option></select>
                    </div>
                    <div>
                        <label style="margin-top:0;">Nota / Observación:</label>
                        <input type="text" id="gc_prod_nota" placeholder="Opcional...">
                    </div>
                </div>
                <button class="btn-info" style="width:100%; margin-top: 20px;" onclick="ejecutarDeudaProducto('${id}')">FIAR PRODUCTO Y DESCONTAR STOCK</button>
            </div>

            <div style="background:var(--card-bg); padding:20px; border:1px solid var(--border); border-radius:4px; margin-bottom:15px;">
                <h4 style="margin:0 0 15px 0;">💵 2. Cargo o Abono Monetario Manual</h4>
                <div class="grid-3" style="align-items: end;">
                    <div>
                        <label style="margin-top:0;">Tipo de Operación:</label>
                        <select id="gc_man_accion"><option value="sumar">➕ Añadir Deuda Extra</option><option value="restar">➖ Registrar Abono / Pago</option></select>
                    </div>
                    <div>
                        <label style="margin-top:0;">Monto a Procesar ($):</label>
                        <input type="number" step="0.01" id="gc_man_monto" placeholder="0.00">
                    </div>
                    <div>
                        <label style="margin-top:0;">Concepto / Motivo:</label>
                        <input type="text" id="gc_man_nota" placeholder="Referencia Zelle, Efectivo...">
                    </div>
                </div>
                <button class="btn-info" style="width:100%; margin-top: 20px;" onclick="ejecutarDeudaManual('${id}')">PROCESAR TRANSACCIÓN MANUAL</button>
            </div>

            <h4 style="margin:0 0 10px 0; border-bottom:1px solid var(--border);">📋 Historial de Movimientos</h4>
            <div style="max-height:250px; overflow-y:auto; border:1px solid var(--border); border-radius: 4px;">
                <table style="width:100%; font-size:0.85rem; text-align:left; margin-top:0; border: none;">
                    <tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Saldo Final</th></tr>
                    ${cli.historial && cli.historial.length > 0 ? cli.historial.map((h, i) => `
                    <tr style="background: ${i % 2 === 0 ? 'var(--card-bg)' : 'var(--item-bg)'}; border-bottom: 1px solid var(--border);">
                        <td>${h.fecha}</td>
                        <td><strong style="color:var(--primary);">${h.tipo}</strong><br><span style="color:var(--muted)">${h.nota||''}</span></td>
                        <td style="font-weight:bold; color:${parseFloat(h.monto)<0?'var(--success)':'var(--danger)'}">${parseFloat(h.monto)<0?'-$':'+$'}${Math.abs(parseFloat(h.monto)).toFixed(2)}</td>
                        <td><strong style="font-family:'Playfair Display', serif; font-size: 1rem;">$${parseFloat(h.saldo_resultante).toFixed(2)}</strong></td>
                    </tr>`).join('') : '<tr><td colspan="4" style="text-align:center; padding: 20px; color:var(--muted); font-style:italic;">No se registran movimientos en el historial.</td></tr>'}
                </table>
            </div>
            
            <button class="btn-warning" style="margin-top:20px;" onclick="cerrarModalGlobal()">CERRAR PANEL</button>
        `;
        abrirModalGlobal(`⚙️ Panel de Gestión: ${cli.nom}`, html);
    }

    async function ejecutarDeudaProducto(clienteId) {
        let sel = document.getElementById('gc_prod_id'); 
        let prodUuid = sel.value; 
        let cant = parseFloat(document.getElementById('gc_prod_cant').value); 
        let tipo = document.getElementById('gc_prod_tipo').value; 
        let nota = document.getElementById('gc_prod_nota').value.trim();
        
        if(!prodUuid || isNaN(cant) || cant <= 0) return alert("⚠️ Selecciona un producto y define una cantidad válida.");
        let pRef = CATALOGO.find(x => x.uuid === prodUuid);
        if(pRef.stock < cant) return alert("❌ Error: No hay stock suficiente en inventario para procesar el fiado.");
        
        let precio = tipo === 'venta' ? pRef.ventaRef : pRef.base; 
        let cargoTotal = precio * cant;
        
        mostrarModalLocal("Procesando", "Cargando deuda e impactando inventario...");
        await transaccionCliente(clienteId, cargoTotal, `Fío Mercancía: ${cant}x ${pRef.nom} (${tipo.toUpperCase()})`, nota);
        pRef.stock -= cant;
        await supabaseClient.from('catalogo').update({ stock: pRef.stock }).eq('id', prodUuid);
        await cargarDatosSupabase(); 
        gestionarCuentaCliente(clienteId);
    }

    async function ejecutarDeudaManual(clienteId) {
        let accion = document.getElementById('gc_man_accion').value; 
        let monto = parseFloat(document.getElementById('gc_man_monto').value); 
        let nota = document.getElementById('gc_man_nota').value.trim();
        
        if(isNaN(monto) || monto <= 0 || !nota) return alert("⚠️ El monto y el concepto (motivo) son obligatorios para procesar la transacción.");
        let valorFinal = accion === 'restar' ? -monto : monto; 
        let etiqueta = accion === 'restar' ? "Abono / Pago Recibido" : "Cargo Monetario Manual";
        
        mostrarModalLocal("Procesando", "Registrando transacción en el libro...");
        await transaccionCliente(clienteId, valorFinal, etiqueta, nota);
        await cargarDatosSupabase(); 
        gestionarCuentaCliente(clienteId);
    }

    async function transaccionCliente(clienteId, montoCambio, tipoTx, nota) {
        let cli = CLIENTES.find(c => c.id === clienteId);
        let hist = cli.historial || []; 
        let nDeuda = (parseFloat(cli.deudaUsd) || 0) + montoCambio;
        
        let fechaActual = new Date().toLocaleString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

        hist.unshift({ fecha: fechaActual, tipo: tipoTx, monto: montoCambio, nota: nota, saldo_resultante: nDeuda });
        await supabaseClient.from('clientes').update({ deuda_usd: nDeuda, historial: hist }).eq('id', clienteId);
    }

    function generarPDFEstadoCuenta(clienteId) {
        let cli = CLIENTES.find(c => c.id === clienteId);
        if (!cli) return;

        const { jsPDF } = window.jspdf || {};
        if (!jsPDF) {
            return alert("Error: La librería de generación PDF no está cargada.");
        }

        mostrarModalLocal("Generando PDF", "Construyendo documento formal de cobranza...");

        setTimeout(() => {
            try {
                let doc = new jsPDF();
                let nombreLocal = CONFIG_GLOBAL?.identidad?.nombre || 'Sistema Comercial Premium';

                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.setTextColor(59, 9, 24);
                doc.text(nombreLocal, 105, 18, { align: "center" });

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.setTextColor(124, 17, 38);
                doc.text("ESTADO DE CUENTA Y RELACIÓN DE BALANCE", 105, 25, { align: "center" });

                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(100, 100, 100);
                doc.text(`Fecha de Emisión: ${new Date().toLocaleDateString()} a las ${new Date().toLocaleTimeString()}`, 105, 30, { align: "center" });

                doc.setDrawColor(212, 175, 55);
                doc.setLineWidth(0.6);
                doc.line(14, 34, 196, 34);

                doc.setFillColor(253, 248, 240);
                doc.roundedRect(14, 38, 182, 22, 2, 2, "F");
                doc.setDrawColor(212, 175, 55);
                doc.roundedRect(14, 38, 182, 22, 2, 2);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.setTextColor(59, 9, 24);
                doc.text("DATOS DEL TITULAR / CLIENTE:", 18, 44);

                doc.setFont("helvetica", "normal");
                doc.setTextColor(45, 55, 72);
                doc.text(`Razón Social / Nombre: ${cli.nom}`, 18, 49);
                doc.text(`Documento de Identidad: ${cli.ced || 'N/A'}`, 18, 54);
                doc.text(`Dirección Física: ${cli.dir || 'No registrada'}`, 18, 59);

                doc.setFillColor(59, 9, 24);
                doc.roundedRect(14, 65, 182, 15, 2, 2, "F");
                
                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.setTextColor(212, 175, 55);
                doc.text("BALANCE TOTAL ADEUDADO AL CORTE:", 18, 74);
                
                doc.setFontSize(14);
                doc.setTextColor(255, 255, 255);
                doc.text(`$${cli.deudaUsd.toFixed(2)}`, 190, 75, { align: "right" });

                let startY = 88;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.setTextColor(59, 9, 24);
                doc.text("HISTORIAL DETALLADO DE MOVIMIENTOS", 14, startY);
                startY += 4;

                function dibujarCabeceraTabla(yPos) {
                    doc.setFillColor(59, 9, 24);
                    doc.rect(14, yPos, 182, 7, "F");
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(8.5);
                    doc.setTextColor(212, 175, 55);
                    doc.text("Fecha Transacción", 16, yPos + 4.8);
                    doc.text("Concepto y Observaciones", 48, yPos + 4.8);
                    doc.text("Monto ($)", 150, yPos + 4.8, { align: "right" });
                    doc.text("Saldo Resultante", 192, yPos + 4.8, { align: "right" });
                }

                dibujarCabeceraTabla(startY);
                startY += 7;

                doc.setFont("helvetica", "normal");
                doc.setFontSize(8.5);

                let historial = cli.historial || [];
                if (historial.length === 0) {
                    startY += 8;
                    doc.setTextColor(100, 100, 100);
                    doc.text("No se registran movimientos ni obligaciones en el historial contable del cliente.", 105, startY, { align: "center" });
                } else {
                    historial.forEach((h, index) => {
                        let fechaStr = String(h.fecha || '');
                        let tipoStr = String(h.tipo || '');
                        let notaStr = h.nota ? ` - ${h.nota}` : '';
                        let conceptoCompleto = tipoStr + notaStr;
                        let montoNum = parseFloat(h.monto) || 0;
                        let saldoNum = parseFloat(h.saldo_resultante) || 0;

                        let montoStr = (montoNum > 0 ? "+ " : "") + montoNum.toFixed(2);
                        let saldoStr = "$" + saldoNum.toFixed(2);

                        let lineasFecha = doc.splitTextToSize(fechaStr, 30);
                        let lineasConcepto = doc.splitTextToSize(conceptoCompleto, 95);
                        
                        let maxLines = Math.max(lineasFecha.length, lineasConcepto.length, 1);
                        let rowHeight = (maxLines * 4.5) + 4;

                        if (startY + rowHeight > 270) {
                            doc.addPage();
                            startY = 20;
                            dibujarCabeceraTabla(startY);
                            startY += 7;
                        }

                        if (index % 2 === 0) {
                            doc.setFillColor(249, 249, 249);
                            doc.rect(14, startY, 182, rowHeight, "F");
                        }

                        doc.setDrawColor(230, 230, 230);
                        doc.rect(14, startY, 182, rowHeight);

                        let textY = startY + 4.5;
                        doc.setTextColor(45, 55, 72);
                        doc.text(lineasFecha, 16, textY);
                        doc.text(lineasConcepto, 48, textY);
                        
                        if (montoNum < 0) {
                            doc.setTextColor(39, 103, 73);
                        } else {
                            doc.setTextColor(179, 0, 0);
                        }
                        doc.text(montoStr, 150, textY, { align: "right" });

                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(59, 9, 24);
                        doc.text(saldoStr, 192, textY, { align: "right" });
                        doc.setFont("helvetica", "normal");

                        startY += rowHeight;
                    });
                }

                let textoAviso = "AVISO DE COBRANZA: El presente documento constituye un estado de cuenta informativo, formal y auditable sobre las obligaciones financieras vigentes con nuestra institución. Solicitamos amablemente verificar los montos expuestos y proceder con la cancelación de los saldos deudores a la brevedad posible.";
                let lineasAviso = doc.splitTextToSize(textoAviso, 174);
                let avisoHeight = (lineasAviso.length * 4.5) + 8;

                if (startY + avisoHeight + 15 > 280) {
                    doc.addPage();
                    startY = 20;
                } else {
                    startY += 10;
                }

                doc.setFillColor(253, 248, 240);
                doc.rect(14, startY, 182, avisoHeight, "F");
                doc.setDrawColor(212, 175, 55);
                doc.rect(14, startY, 182, avisoHeight);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(8.5);
                doc.setTextColor(124, 17, 38);
                doc.text("NOTA IMPORTANTE:", 18, startY + 5);

                doc.setFont("helvetica", "normal");
                doc.setTextColor(60, 60, 60);
                doc.text(lineasAviso, 18, startY + 10);

                doc.save(`Estado_de_Cuenta_${cli.nom.replace(/\s+/g, '_')}.pdf`);
                cerrarModalGlobal();
            } catch(e) {
                cerrarModalGlobal();
                alert("Error al generar el PDF: " + e.message);
            }
        }, 300);
    }

    function abrirModalGlobal(titulo, htmlContent) { 
        document.getElementById('global_modal_title').innerText = titulo; 
        document.getElementById('global_modal_body').innerHTML = htmlContent; 
        document.getElementById('global_modal').style.display = 'flex'; 
    }
    function cerrarModalGlobal() { document.getElementById('global_modal').style.display = 'none'; }
    function mostrarModalLocal(titulo, msg) { 
        abrirModalGlobal(titulo, `<div style="text-align:center; padding:20px;"><div class="spinner-luxury" style="width: 35px; height: 35px; border-width: 3px;"></div><span style="font-size:1.1rem; color:var(--primary); font-family:'Playfair Display', serif;">${msg}</span></div>`); 
    }
</script>
</body>
</html>
