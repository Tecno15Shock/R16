<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vendedores | Panel Administrativo</title>
    <!-- Librería Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librería jsPDF nativa para generación de comprobantes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Fuentes Ultra-Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================================= */
        /* VARIABLES DE ESTILO PREMIUM (Carmesí, Dorado y Fondo Claro)*/
        /* ========================================================= */
        :root {
            --active-gold: #D4AF37; 
            
            /* Paleta Carmesí Institucional */
            --primary: #3b0918; 
            --secondary: #7c1126; 
            --crimson-dark: #4A0E12;
            
            --bg: #FDFBF7; 
            --text: #2A2A2A; 
            --muted: #555555;
            --border: #E8E0D5; 
            --card-bg: #FFFFFF; 
            --item-bg: #FCFBFA; 
            
            --danger: #8B0000; 
            --success: #2E7D32; 
            --warning: #B8860B; 
            --info: #2c3e50;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.5; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .wrapper { display: block; min-height: 100vh; position: relative; padding: 40px 20px 100px 20px; max-width: 1100px; margin: 0 auto; }

        /* ========================================================= */
        /* BOTÓN X FLOTANTE CON FONDO BLANCO                         */
        /* ========================================================= */
        .close-corner-btn {
            position: fixed; top: 20px; right: 25px; z-index: 10000;
            background: #FFFFFF; backdrop-filter: blur(8px);
            border: 2px solid var(--active-gold); color: var(--primary);
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem; font-weight: bold; cursor: pointer; text-decoration: none;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .close-corner-btn:hover { background: var(--primary); color: #FFFFFF; transform: scale(1.1) rotate(90deg); }

        /* ========================================================= */
        /* CONTENEDORES PRINCIPALES Y TARJETAS */
        /* ========================================================= */
        .main-content { max-width: 1100px; margin: 0 auto; }
        .card { 
            background: var(--card-bg); padding: 25px; border-radius: 8px; margin-bottom: 25px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); border: 1px solid var(--border);
            border-top: 4px solid var(--primary); position: relative; overflow: hidden;
        }
        
        h2 { 
            color: var(--primary); margin-top: 0; font-size: 1.35rem; border-bottom: 1px solid var(--border); 
            padding-bottom: 12px; text-align: center; font-family: 'Playfair Display', serif; 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;
        }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        
        label { font-size: 0.85rem; font-weight: bold; display: block; margin-top: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { 
            width: 100%; padding: 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 4px; 
            font-size: 1rem; background: #FAFAFA; transition: all 0.3s ease; color: var(--text); border-left: 4px solid #DDD; font-family: 'Roboto', sans-serif;
        }
        input:focus, select:focus { outline: none; background: #FFF; border-color: var(--active-gold); border-left: 4px solid var(--active-gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.25); }

        button { font-family: 'Roboto', sans-serif; border: none; padding: 12px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 0.95rem; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        button:active { transform: scale(0.98); }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-success { background: var(--success); color: white; }
        .btn-info { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--active-gold); border: 1px solid var(--active-gold); }
        .btn-add { background: var(--item-bg); color: var(--primary); border: 1px solid var(--border); width: auto; display: inline-block; padding: 10px 15px; border-left: 4px solid var(--active-gold); }
        .btn-add:hover { background: var(--primary); color: var(--active-gold); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; background: var(--card-bg); border: 1px solid var(--border); }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        th { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: var(--active-gold); font-family: 'Playfair Display', serif; letter-spacing: 1px; border-color: var(--active-gold); }

        .employee-card { border: 1px solid var(--border); padding: 18px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); margin-bottom: 15px; border-radius: 6px; border-left: 4px solid var(--active-gold); box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.3s; }
        .employee-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }

        /* ========================================================= */
        /* MODALES Y PANTALLAS DE CARGA Y BLOQUEO INTELIGENTE        */
        /* ========================================================= */
        #loading_overlay, #pantalla_bloqueo_admin {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(74, 14, 18, 0.95), rgba(5, 5, 5, 0.98));
            z-index: 99999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 100000; display: none; align-items: center; justify-content: center; animation: fadeIn 0.25s ease-in-out; }
        .custom-modal-box { background: var(--card-bg); padding: 30px; border-radius: 8px; width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 2px solid var(--active-gold); }
        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: var(--primary); color: var(--active-gold); border: 1px solid var(--active-gold); border-radius: 50%; width: 34px; height: 34px; font-weight: bold; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; font-family: Arial, sans-serif; padding:0; margin:0; }
        .modal-close-btn:hover { background: var(--danger); transform: scale(1.05); color: #FFF; }
        .custom-modal-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 20px; font-weight: bold; border-bottom: 2px solid var(--active-gold); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        #global_modal_body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }

        .search-result-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .search-result-item:hover { background: rgba(212, 175, 55, 0.1); border-left: 3px solid var(--active-gold); }

        .spinner-luxury {
            width: 50px; height: 50px; border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--active-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 25px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .badge-nivel {
            display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 12px;
            background: rgba(212, 175, 55, 0.15); color: var(--active-gold); border: 1px solid var(--active-gold);
        }
    </style>
</head>
<body>

<!-- BOTÓN X FLOTANTE CON FONDO BLANCO -->
<a href="principal.html" class="close-corner-btn" title="Volver al Menú Principal">✕</a>

<!-- MODAL DE CARGA INICIAL (LUXURY) -->
<div id="loading_overlay">
    <div class="card" style="width: 380px; text-align: center; border-top: 4px solid var(--active-gold); box-shadow: 0 25px 60px rgba(0,0,0,0.8); background: #FFFFFF; margin:0;">
        <div class="spinner-luxury"></div>
        <h2 style="color: var(--primary); border: none; font-size: 1.2rem; margin-bottom:5px;">Sincronizando Módulo</h2>
        <p style="font-size: 0.9rem; color: var(--muted); font-family: 'Playfair Display', serif; font-style: italic;">Cargando personal, auditorías y ventas...</p>
    </div>
</div>

<!-- 🔒 PANTALLA DE BLOQUEO INTELIGENTE POR NIVELES -->
<div id="pantalla_bloqueo_admin" style="display: none;">
    <div class="card" style="width: 380px; text-align: center; border-top: 4px solid var(--active-gold); margin: 0; box-shadow: 0 25px 60px rgba(0,0,0,0.8); background: #FFFFFF;">
        <h2 style="color: var(--primary); border-bottom-color: var(--active-gold);">🔒 Módulo Protegido</h2>
        <div id="info_nivel_bloqueo" class="badge-nivel">Verificando nivel de acceso...</div>
        <p style="font-size: 0.95rem; color: var(--muted); margin-bottom: 20px;">Introduce la credencial o PIN correspondiente:</p>
        
        <div style="position: relative; margin-bottom: 20px;">
            <input type="password" id="pin_ingreso_body" placeholder="••••" style="text-align: center; font-size: 1.8rem; letter-spacing: 8px; width: 100%; padding-right: 45px; margin-top: 0; font-family: 'Courier New', Courier, monospace;" onkeyup="if(event.key==='Enter') verificarPinInteligente()">
            <span id="icono_ojo_pin" onclick="toggleVerPin()" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.3rem;">👁️</span>
        </div>

        <button id="btn_desbloquear_pin" class="btn-info" onclick="verificarPinInteligente()" style="margin-top: 0; padding: 14px; font-size: 1rem; letter-spacing: 1.5px;">Desbloquear Pantalla</button>
        <button id="btn_volver_pin" class="btn-danger" onclick="window.location.href='principal.html'" style="margin-top: 10px; padding: 12px; font-size: 0.95rem; width: 100%;">Volver al Inicio</button>
    </div>
</div>

<!-- MODAL GLOBAL PARA EDICIONES -->
<div id="global_modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <button class="modal-close-btn" onclick="cerrarModalGlobal()">✕</button>
        <div id="global_modal_title" class="custom-modal-title">Título</div>
        <div id="global_modal_body"></div>
    </div>
</div>

<div class="wrapper">
    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <div class="card" style="border-top: 4px solid var(--active-gold);">
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="font-family: 'Playfair Display', serif; color: var(--primary); margin: 0; font-size: 1.8rem; text-transform: uppercase;">🧑‍💼 Gestión de Vendedores</h1>
                <p id="subtitulo_local" style="color: var(--muted); font-size: 0.95rem; margin-top: 5px; font-weight: 500; font-family: 'Playfair Display', serif; font-style: italic;">Gestione el equipo de ventas, supervise cierres de caja y asigne privilegios de sistema.</p>
            </div>
            
            <button onclick="abrirModalNuevoEmpleado()" class="btn-info" style="width:100%; margin-bottom:20px; font-size: 1.05rem;">+ AÑADIR NUEVO VENDEDOR</button>
            <input type="text" id="buscar_empleado" placeholder="🔍 Buscar por nombre o cédula..." oninput="renderEmpleados()" style="margin-bottom:20px; font-size: 1rem;">
            <div id="lista_empleados_container"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://khazglefhixcdynrdixj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__ysP-HoZp2sWZLqQfnDOAg_zcTQSV3i';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let CURRENT_LOCAL_ID = null;
    let CONFIG_GLOBAL_MODULOS = {};
    let EMPLEADOS = [];
    let CATALOGO = [];
    let CONFIG_GLOBAL = {};
    let LOTES_GENERAL = [];
    let ADMIN_PASS_DB = '151016';

    window.loteEditLoteId = null;
    window.loteEditDetallesOriginal = [];
    window.loteEditDetallesTmp = [];

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                await sincronizarSesion(data.session.user.id);
            } else {
                window.location.href = 'index.html';
            }
        } catch(e) {
            console.error("Fallo crítico de sesión", e);
            window.location.href = 'index.html';
        }
    });

    async function sincronizarSesion(userId) {
        let { data: perfil } = await supabaseClient.from('perfiles').select('local_id, nombre').eq('id', userId).single();
        if (perfil && perfil.local_id) {
            CURRENT_LOCAL_ID = perfil.local_id;
        } else {
            let { data: localesList } = await supabaseClient.from('locales').select('id, nombre').limit(1);
            if(localesList && localesList.length > 0) CURRENT_LOCAL_ID = localesList[0].id;
        }

        let conf = null, localData = null;
        try {
            let resConf = await supabaseClient.from('configuraciones').select('*').eq('local_id', CURRENT_LOCAL_ID).maybeSingle();
            conf = resConf.data;
        } catch(e) { console.warn("Sin configuración"); }

        try {
            let resLocal = await supabaseClient.from('locales').select('nombre, password_admin').eq('id', CURRENT_LOCAL_ID).maybeSingle();
            localData = resLocal.data;
        } catch(e) { console.warn("Sin local"); }

        if (conf) {
            CONFIG_GLOBAL = conf;
            if(conf.identidad && conf.identidad.admin_pass) ADMIN_PASS_DB = conf.identidad.admin_pass;
            if(conf.permisos_modulos) CONFIG_GLOBAL_MODULOS = conf.permisos_modulos;
        }

        if (localData && localData.password_admin) {
            ADMIN_PASS_DB = localData.password_admin;
        }

        let nombreLocal = localData?.nombre || conf?.identidad?.nombre || 'Panel Empresarial';
        
        const subContainer = document.querySelector('.main-content > div');
        if (subContainer) {
            let pLocal = document.createElement('p');
            pLocal.style.color = 'var(--muted)';
            pLocal.style.fontSize = '0.95rem';
            pLocal.style.marginTop = '5px';
            pLocal.style.fontWeight = '500';
            pLocal.innerText = `🏪 ${nombreLocal}`;
            subContainer.appendChild(pLocal);
        }
        
        await cargarDatosServidor();

        setTimeout(() => {
            document.getElementById('loading_overlay').style.display = 'none';
            evaluarSistemaBloqueoInteligente();
        }, 800);
    }

    // ==========================================
    // SISTEMA DE BLOQUEO INTELIGENTE POR NIVELES
    // ==========================================
    function evaluarSistemaBloqueoInteligente() {
        const permisosMod = CONFIG_GLOBAL_MODULOS['empleados'] || { general: true, admin: true, sup: false, vend: false };
        
        let estaBloqueado = false;
        let nivelRequeridoTexto = "Acceso Libre / General";

        if (permisosMod.general) {
            estaBloqueado = true;
            if (permisosMod.admin) nivelRequeridoTexto = "👑 Nivel Administrador Requerido";
            else if (permisosMod.sup) nivelRequeridoTexto = "👁️ Nivel Supervisor Requerido";
            else if (permisosMod.vend) nivelRequeridoTexto = "🛒 Nivel Vendedor Requerido";
            else nivelRequeridoTexto = "🔒 Módulo Bloqueado General";
        }

        if (estaBloqueado) {
            document.getElementById('info_nivel_bloqueo').innerText = nivelRequeridoTexto;
            document.getElementById('pantalla_bloqueo_admin').style.display = 'flex';
            document.getElementById('pin_ingreso_body').focus();
        } else {
            document.getElementById('pantalla_bloqueo_admin').style.display = 'none';
        }
    }

    async function cargarDatosServidor() {
        if(!CURRENT_LOCAL_ID) return;
        const [resEmp, resCat, resLotes] = await Promise.all([
            supabaseClient.from('empleados').select('*').eq('local_id', CURRENT_LOCAL_ID),
            supabaseClient.from('catalogo').select('*'),
            supabaseClient.from('lotes_diarios').select('*').eq('local_id', CURRENT_LOCAL_ID)
        ]);

        if(resEmp.data) {
            EMPLEADOS = resEmp.data.sort((a,b) => (a.nombre + " " + a.apellido).localeCompare(b.nombre + " " + b.apellido));
        }

        if(resCat.data) CATALOGO = resCat.data;
        if(resLotes.data) LOTES_GENERAL = resLotes.data;

        renderEmpleados();
    }

    function toggleVerPin() {
        let input = document.getElementById('pin_ingreso_body');
        let icono = document.getElementById('icono_ojo_pin');
        if (input.type === 'password') {
            input.type = 'text'; icono.innerText = '🙈';
        } else {
            input.type = 'password'; icono.innerText = '👁️';
        }
    }

    function togglePinModal(inputId, icono) {
        let input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icono.innerText = '🙈';
        } else {
            input.type = 'password';
            icono.innerText = '👁️';
        }
    }

    async function verificarPinInteligente() {
        let pinIngresado = document.getElementById('pin_ingreso_body').value.trim();
        let btn = document.getElementById('btn_desbloquear_pin');
        let supervisorValido = EMPLEADOS.some(e => (e.rol === 'Administrador' || e.rol === 'Supervisor') && (e.pin_acceso === pinIngresado || e.pin === pinIngresado));

        btn.innerHTML = "⏳ Verificando acceso...";
        btn.disabled = true;

        await new Promise(resolve => setTimeout(resolve, 600));

        if (pinIngresado === ADMIN_PASS_DB || supervisorValido) {
            let pantalla = document.getElementById('pantalla_bloqueo_admin');
            pantalla.style.animation = 'fadeIn 0.3s reverse';
            setTimeout(() => {
                pantalla.style.display = 'none';
                btn.innerHTML = "Desbloquear Pantalla";
                btn.disabled = false;
            }, 250);
        } else {
            alert("❌ PIN Incorrecto. Autorización denegada para este nivel.");
            document.getElementById('pin_ingreso_body').value = '';
            btn.innerHTML = "Desbloquear Pantalla";
            btn.disabled = false;
        }
    }

    function renderEmpleados() {
        let q = document.getElementById('buscar_empleado').value.toLowerCase();
        let html = "";

        EMPLEADOS.filter(e => (e.nombre + " " + e.apellido + " " + (e.cedula||"")).toLowerCase().includes(q)).forEach(emp => {
            let lotesEmp = LOTES_GENERAL.filter(l => l.vendedor_id === emp.id);
            let totalCierres = lotesEmp.length;
            let totalVenta = lotesEmp.reduce((acc, l) => acc + (parseFloat(l.total_vendido_usd) || 0), 0);
            let totalCapital = lotesEmp.reduce((acc, l) => acc + (parseFloat(l.capital_invertido) || 0), 0);
            let totalGanancia = lotesEmp.reduce((acc, l) => acc + (parseFloat(l.ganancia_neta) || 0), 0);

            html += `
            <div class="employee-card">
                <div style="flex: 1;">
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 5px;">
                        <strong style="font-size:1.15rem; color:var(--primary); font-family: 'Playfair Display', serif;">${emp.nombre} ${emp.apellido}</strong>
                        <span style="background: rgba(212, 175, 55, 0.15); color: var(--primary); font-size: 0.75rem; font-weight: bold; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--active-gold); text-transform: uppercase;">📌 ${emp.rol || 'Cajero'}</span>
                    </div>
                    <small style="color: var(--muted); font-family:'Roboto', sans-serif;">C.I: ${emp.cedula || 'N/A'} | Tel: ${emp.telefono || 'N/A'}</small><br>
                    <div style="margin-top:10px; font-size:0.9rem; display:flex; flex-wrap:wrap; gap:10px; font-family:'Roboto', sans-serif;">
                        <span style="background: var(--item-bg); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border);">📦 Cierres: <strong style="color:var(--text);">${totalCierres}</strong></span>
                        <span style="background: var(--item-bg); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border);">💵 Venta: <strong style="color:var(--primary);">$${formatearNumero(totalVenta)}</strong></span>
                        <span style="background: var(--item-bg); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border);">📈 Capital: <strong style="color:var(--warning);">$${formatearNumero(totalCapital)}</strong></span>
                        <span style="background: var(--item-bg); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border);">💰 Ganancia: <strong style="color:var(--success);">$${formatearNumero(totalGanancia)}</strong></span>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end; margin-left: 15px; min-width: 140px;">
                    <div style="display:flex; gap:6px; width: 100%;">
                        <button class="btn-add" style="padding:8px 12px; margin:0; flex:1; font-size:0.85rem;" onclick="editarEmpleado('${emp.id}')">✏️ Editar</button>
                        <button class="btn-danger" style="padding:8px 12px; margin:0; width: auto; font-size:0.85rem;" onclick="eliminarEmpleado('${emp.id}')">🗑️</button>
                    </div>
                    <button class="btn-info" style="padding:10px; margin:0; width:100%; font-size:0.85rem;" onclick="verVentasEmpleado('${emp.id}', '${emp.nombre} ${emp.apellido}')">📊 AUDITORÍA</button>
                </div>
            </div>`;
        });

        document.getElementById('lista_empleados_container').innerHTML = html || '<p style="text-align:center; color:var(--muted); padding: 20px; font-style: italic; font-family:\'Playfair Display\', serif;">No se encontraron registros activos en el sistema.</p>';
    }

    function abrirModalNuevoEmpleado() {
        abrirModalGlobal("Registrar Nuevo Colaborador", `
            <div class="grid-2">
                <div><label>Nombre:</label><input type="text" id="emp_nombre" placeholder="Nombres"></div>

    async function editarLoteVenta(loteId) {
        mostrarModalLocal("Análisis de Modificación", "Habilitando visor de edición inteligente...");
        let { data: detalle } = await supabaseClient.from('detalle_ventas').select('*, catalogo(*)').eq('lote_id', loteId);
        let { data: lote } = await supabaseClient.from('lotes_diarios').select('*').eq('id', loteId).single();
        cerrarModalGlobal();
        if(!detalle) return alert("Fallo de infraestructura en despliegue de detalles.");

        detalle.sort((a, b) => {
            let nameA = limpiarNombre(a.catalogo?.nombre || '').toLowerCase();
            let nameB = limpiarNombre(b.catalogo?.nombre || '').toLowerCase();
            return nameA.localeCompare(nameB);
        });

        window.loteEditLoteId = loteId;
        window.loteEditDetallesOriginal = JSON.parse(JSON.stringify(detalle));
        window.loteEditDetallesTmp = JSON.parse(JSON.stringify(detalle));

        let modoDetectado = 'venta';
        let conteoCaja = 0; let conteoVenta = 0;

        detalle.forEach(d => {
            if (d.cantidad > 0 && d.catalogo) {
                let pUnit = d.subtotal_usd / d.cantidad;
                let pBase = parseFloat(d.catalogo.precio_base) || 0;
                let pVenta = parseFloat(d.catalogo.precio_venta) || 0;
                
                if (Math.abs(pUnit - pBase) <= 0.05 && pBase > 0) conteoCaja++;
                else if (Math.abs(pUnit - pVenta) <= 0.05) conteoVenta++;
                
                if (d.catalogo.nombre.toLowerCase().includes('box_-')) conteoCaja += 2;
            }
        });
        
        if (conteoCaja > conteoVenta) modoDetectado = 'caja';

        let html = `
            <p style="font-size:0.85rem; color:var(--primary); margin-bottom:12px; font-weight: bold; padding: 10px; background: rgba(212, 175, 55, 0.15); border-left: 4px solid var(--primary);">
                ⚠️ ATENCIÓN: Las alteraciones volumétricas en el lote impactarán directamente el Inventario Físico (Retorno/Descuento de Stock).
            </p>
            
            <div id="contenedor_tabla_edicion_lote" style="max-height:40vh; overflow-y:auto; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 4px;"></div>
            
            <div style="background: var(--item-bg); padding: 20px; border-radius: 4px; border: 1px solid var(--border);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                    <label style="margin:0; color:var(--primary); font-family: 'Playfair Display', serif; font-size: 1.1rem;">➕ Incorporar Referencia Catálogo:</label>
                    
                    <select id="modo_precio_lote" onchange="buscarProductoLoteEdit(document.getElementById('buscador_add_producto').value)" style="width: auto; padding: 8px; font-size: 0.9rem; border-color:var(--active-gold); background:var(--card-bg);">
                        <option value="venta" ${modoDetectado === 'venta' ? 'selected' : ''}>🛒 Coste Distribución (Detal)</option>
                        <option value="caja" ${modoDetectado === 'caja' ? 'selected' : ''}>📦 Coste Logístico (Mayor)</option>
                    </select>
                </div>
                
                <input type="text" id="buscador_add_producto" placeholder="Escanee o ingrese parámetro de búsqueda..." oninput="buscarProductoLoteEdit(this.value)" style="margin-bottom: 5px;">
                <div id="resultado_busqueda_edit" style="max-height: 160px; overflow-y: auto; background: var(--card-bg); border-radius: 4px;"></div>
            </div>

            <button class="btn-info" style="margin-top:25px; width:100%; padding:15px; font-size:1.05rem;" onclick="guardarEdicionLoteVenta('${loteId}')">💾 CONFIRMAR AJUSTES Y SINCRONIZAR STOCK</button>
        `;
        
        abrirModalGlobal("Corrección y Arqueo de Lote", html);
        actualizarUIEdicionLote();
    }

    function buscarProductoLoteEdit(q) {
        let res = document.getElementById('resultado_busqueda_edit');
        if(!q) { res.innerHTML = ''; return; }
        
        let modo = document.getElementById('modo_precio_lote').value;
        let html = '';
        
        CATALOGO.filter(p => p.nombre.toLowerCase().includes(q.toLowerCase()) && p.activo).forEach(p => {
            let pBase = parseFloat(p.precio_base) || 0;
            let pVenta = parseFloat(p.precio_venta) || 0;
            
            let precio = (modo === 'caja' && pBase > 0) ? pBase : pVenta;
            let etiqueta = modo === 'caja' ? '📦 Tasa Mayor' : '🛒 Tasa Detal';
            
            html += `<div class="search-result-item" onclick="agregarProductoALoteEdit('${p.id}', ${precio})">
                <span style="font-family:'Playfair Display', serif; color:var(--primary);">➕ <strong>${limpiarNombre(p.nombre)}</strong> <small style="color:var(--muted); font-family:'Roboto',sans-serif;">(${etiqueta})</small></span>
                <span style="color:var(--success); font-weight:bold; background:#e8f8f5; padding:4px 8px; border-radius:4px; border: 1px solid #1e8449;">$${precio.toFixed(2)}</span>
            </div>`;
        });
        res.innerHTML = html || '<div style="padding:15px; color:var(--danger); text-align:center;">Criterio no localizado en Catálogo Maestro.</div>';
    }

    function agregarProductoALoteEdit(prodId, precioAplicado) {
        let p = CATALOGO.find(x => x.id === prodId);
        if(!p) return;
        
        let existingById = window.loteEditDetallesTmp.find(x => x.producto_id === prodId);
        
        if (existingById) {
            existingById.cantidad += 1;
            existingById.precio_aplicado = precioAplicado;
        } else {
            window.loteEditDetallesTmp.push({
                id: null,
                lote_id: window.loteEditLoteId,
                producto_id: prodId,
                cantidad: 1,
                precio_aplicado: precioAplicado,
                subtotal_usd: precioAplicado,
                catalogo: p
            });
        }
        
        document.getElementById('buscador_add_producto').value = '';
        document.getElementById('resultado_busqueda_edit').innerHTML = '';
        actualizarUIEdicionLote();
    }

        window.loteEditDetallesTmp.sort((a, b) => {

        window.loteEditDetallesTmp.forEach((d, idx) => {

            let pUnit = 0;
            if (d.precio_aplicado !== undefined) pUnit = d.precio_aplicado;
            else if (d.cantidad > 0) pUnit = d.subtotal_usd / d.cantidad;
            
            html += `<tr style="background: ${idx % 2 === 0 ? 'var(--card-bg)' : 'var(--item-bg)'};">
                <td style="padding: 12px; border-bottom: 1px solid var(--border); font-family:'Playfair Display', serif; color:var(--primary);"><strong>${limpiarNombre(pNom)}</strong></td>
                <td style="padding: 12px; border-bottom: 1px solid var(--border); text-align:right; color:var(--success); font-weight:bold;">$${pUnit.toFixed(2)}</td>
                <td style="padding: 12px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:5px;">

                </td>

    function modificarCantidadLoteEdit(idx, delta) {
        let currentItem = window.loteEditDetallesTmp[idx];
        let nuevaCant = Math.max(0, currentItem.cantidad + delta);
        
        if (nuevaCant === 0) {
            window.loteEditDetallesTmp.splice(idx, 1);
        } else {
            currentItem.cantidad = nuevaCant;
        }
        actualizarUIEdicionLote();
    }

    async function guardarEdicionLoteVenta(loteId) {
        mostrarModalLocal("Procesando Transacción", "Validación cruzada con Sistema de Inventario...");
        try {
            let original = window.loteEditDetallesOriginal || [];
            let actual = window.loteEditDetallesTmp || [];
            
            let totalVentaNuevo = 0; 
            let totalCapitalNuevo = 0;

            let todosLosProductos = {}; 
            original.forEach(d => { todosLosProductos[d.producto_id] = { orig: d, act: null }; });
            actual.forEach(d => {
                if(!todosLosProductos[d.producto_id]) todosLosProductos[d.producto_id] = { orig: null, act: d };
                else todosLosProductos[d.producto_id].act = d;
            });

            for (let prodId in todosLosProductos) {
                let dOrig = todosLosProductos[prodId].orig;
                let dAct = todosLosProductos[prodId].act;
                
                let cantOrig = dOrig ? dOrig.cantidad : 0;
                let cantAct = dAct ? dAct.cantidad : 0;
                let diffCant = cantAct - cantOrig;

                let cat = CATALOGO.find(c => c.id === prodId);
                if(!cat && dOrig) cat = dOrig.catalogo;
                
                let precioUnit = 0;
                if (dAct && dAct.precio_aplicado !== undefined) {
                    precioUnit = dAct.precio_aplicado;
                } else if (dOrig && dOrig.cantidad > 0) {
                    precioUnit = dOrig.subtotal_usd / dOrig.cantidad;
                } else if (cat) {
                    precioUnit = cat.precio_venta || cat.precio_base;
                }
                
                let costoUnit = cat?.costo_fuente || 0;
                let subtotalUsd = cantAct * precioUnit;

                if (diffCant !== 0 && cat) {
                    let nuevoStock = Math.max(0, parseFloat(cat.stock || 0) - diffCant);
                    await supabaseClient.from('catalogo').update({ stock: nuevoStock }).eq('id', prodId);
                    cat.stock = nuevoStock; 
                }

                if (cantAct > 0) {
                    totalVentaNuevo += subtotalUsd;
                    totalCapitalNuevo += (costoUnit * cantAct);
                    
                    if (dOrig) { 
                        await supabaseClient.from('detalle_ventas').update({ cantidad: cantAct, subtotal_usd: subtotalUsd }).eq('id', dOrig.id);
                    } else { 
                        await supabaseClient.from('detalle_ventas').insert([{
                            lote_id: loteId, producto_id: prodId, cantidad: cantAct, subtotal_usd: subtotalUsd
                        }]);
                    }
                } else {
                    if (dOrig && dOrig.id) { 
                        await supabaseClient.from('detalle_ventas').delete().eq('id', dOrig.id);
                    }
                }
            }

            let gananciaNueva = totalVentaNuevo - totalCapitalNuevo;
            
            await supabaseClient.from('lotes_diarios').update({
                total_vendido_usd: totalVentaNuevo,
                capital_invertido: totalCapitalNuevo,
                ganancia_neta: gananciaNueva
            }).eq('id', loteId);

            let nuevosDetallesJson = actual.map(d => {
                let cat = CATALOGO.find(c => c.id === d.producto_id) || d.catalogo;
                let pUnit = d.cantidad > 0 ? (d.subtotal_usd / d.cantidad) : 0;
                return {
                    nombre: limpiarNombre(cat?.nombre || 'Referencia Comercial'),
                    E: 0,
                    S: d.cantidad,
                    VP: cat?.precio_venta || pUnit,
                    PI: pUnit,
                    VT: d.subtotal_usd
                };
            });

            await supabaseClient.from('control_inventario_cierres').update({
                detalles_json: nuevosDetallesJson,
                total_usd: totalVentaNuevo
            }).eq('lote_id', loteId);

            cerrarModalGlobal();
            alert("✅ Consolidación de inventario completada sin incidencias.");
            await cargarDatosServidor();
            
        } catch(e) {
            cerrarModalGlobal();
            alert("❌ Falta de integridad en datos cruzados: " + e.message);
        }
    }

    async function descargarPDFLote(loteId) {
        mostrarModalLocal("Generando PDF", "Construyendo documento dictamen...");
        try {
            const [resDet, resLote, resCierre] = await Promise.all([
                supabaseClient.from('detalle_ventas').select('*, catalogo(nombre)').eq('lote_id', loteId),
                supabaseClient.from('lotes_diarios').select('*, empleados(nombre, apellido)').eq('id', loteId).single(),
                supabaseClient.from('control_inventario_cierres').select('*').eq('lote_id', loteId).maybeSingle()
            ]);

            cerrarModalGlobal();
            let detalle = resDet.data;
            let lote = resLote.data;
            if(!detalle || !lote) return alert("El registro del comprobante se encuentra corrupto o vacío.");

            detalle.sort((a, b) => {
                let nameA = limpiarNombre(a.catalogo?.nombre || '').toLowerCase();
                let nameB = limpiarNombre(b.catalogo?.nombre || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });

            let empleadoCierraNom = "NO ESPECIFICADO";
            let empleadoRecibeNom = "NO ESPECIFICADO";

            if (resCierre.data) {
                let idCierra = resCierre.data.empleado_cierra;
                let idRecibe = resCierre.data.empleado_recibe;
                if (idCierra) {
                    let empC = EMPLEADOS.find(e => e.id === idCierra);
                    if (empC) empleadoCierraNom = `${empC.nombre} ${empC.apellido}`;
                }
                if (idRecibe) {
                    let empR = EMPLEADOS.find(e => e.id === idRecibe);
                    if (empR) empleadoRecibeNom = `${empR.nombre} ${empR.apellido}`;
                }
            }
            if (empleadoCierraNom === "NO ESPECIFICADO" && lote.empleados) {
                empleadoCierraNom = `${lote.empleados.nombre} ${lote.empleados.apellido}`;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let nombreLocal = CONFIG_GLOBAL.identidad?.nombre || 'PANEL EMPRESARIAL';

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(15);
            doc.setTextColor(122, 23, 29);
            doc.text(nombreLocal.toUpperCase(), 14, 16);

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(100, 100, 100);
            doc.text("AUDITORÍA: CIERRE DE TURNO COMERCIAL", 14, 22);

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(10);
            doc.setTextColor(40, 40, 40);
            doc.text(`Corte Operativo: ${lote.fecha}`, 196, 16, { align: 'right' });

            doc.setDrawColor(212, 175, 55); 
            doc.setLineWidth(0.8);
            doc.line(14, 26, 196, 26);

            doc.setFillColor(249, 248, 246);
            doc.roundedRect(14, 30, 182, 15, 2, 2, "F");

            doc.setFontSize(7.5);
            doc.setTextColor(100, 100, 100);
            doc.text("LIQUIDADOR (ENTREGA):", 17, 36);
            doc.text("SUPERVISIÓN (RECEPCIÓN):", 110, 36);

            doc.setFontSize(9);
            doc.setFont("Helvetica", "bold");
            doc.setTextColor(59, 9, 24);
            doc.text(String(empleadoCierraNom.toUpperCase()), 17, 42);
            doc.text(String(empleadoRecibeNom.toUpperCase()), 110, 42);

            let tasasObj = lote.tasas || CONFIG_GLOBAL.tasas || {};
            let tasaBs = tasasObj.ves || tasasObj.bs || 1;
            let tasaCop = tasasObj.cop || 0;
            let tasaEur = tasasObj.eur || 0;

            let posY = 51;

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(122, 23, 29);
            doc.text("Reporte de Movimientos", 14, posY);
            
            doc.setFont("Helvetica", "normal");
            doc.setFontSize(8);
            doc.setTextColor(100, 100, 100);
            doc.text(`Métrica Cambiaria: BS: ${tasaBs} | COP: ${tasaCop} | EUR: ${tasaEur}`, 196, posY, { align: 'right' });

            posY += 4;
            doc.setFontSize(8);
            doc.setFillColor(122, 23, 29); 
            doc.setTextColor(212, 175, 55); 
            doc.rect(14, posY, 182, 6.5, "F");
            doc.setFont("Helvetica", "bold");
            doc.text("Detalle de Referencia Comercial", 17, posY + 4.5);
            doc.text("Vol", 125, posY + 4.5, { align: 'center' });
            doc.text("Val. Unit.", 155, posY + 4.5, { align: 'right' });
            doc.text("Importe ($)", 192, posY + 4.5, { align: 'right' });

            posY += 6.5;
            doc.setFont("Helvetica", "normal");
            doc.setTextColor(40, 40, 40);

            let totalCant = 0;
            let totalUsd = 0;

            detalle.forEach((d, index) => {
                if (posY > 265) {
                    doc.addPage();
                    posY = 20;
                }
                if (index % 2 === 0) {
                    doc.setFillColor(249, 248, 246);
                    doc.rect(14, posY, 182, 6.5, "F");
                }
                
                let pNom = limpiarNombre(d.catalogo ? d.catalogo.nombre : 'Producto Genérico');
                let precioUnit = d.cantidad > 0 ? (d.subtotal_usd / d.cantidad) : 0;
                totalCant += d.cantidad;
                totalUsd += d.subtotal_usd;

                doc.text(String(pNom), 17, posY + 4.5);
                doc.text(String(d.cantidad), 125, posY + 4.5, { align: 'center' });
                doc.text(`$${parseFloat(precioUnit).toFixed(2)}`, 155, posY + 4.5, { align: 'right' });
                doc.setFont("Helvetica", "bold");
                doc.text(`$${parseFloat(d.subtotal_usd).toFixed(2)}`, 192, posY + 4.5, { align: 'right' });
                doc.setFont("Helvetica", "normal");

                posY += 6.5;
            });

            posY += 6;

            if (posY > 250) {
                doc.addPage();
                posY = 20;
            }

            doc.setFillColor(249, 248, 246);
            doc.roundedRect(120, posY, 76, 18, 2, 2, "F");

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(100, 100, 100);
            doc.text("Flujo total de productos:", 125, posY + 7);
            doc.text(String(totalCant), 191, posY + 7, { align: 'right' });

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(9.5);
            doc.setTextColor(122, 23, 29);
            doc.text("IMPORTE BRUTO FINAL:", 125, posY + 14);
            doc.text(`$${parseFloat(totalUsd).toFixed(2)}`, 191, posY + 14, { align: 'right' });

            let nombreArchivo = `Dictamen_Cierre_${lote.fecha}.pdf`;
            doc.save(nombreArchivo);
        } catch(e) {
            cerrarModalGlobal();
            alert("❌ Falla en la inyección de metadatos PDF: " + e.message);
            console.error(e);
        }
    }

    async function eliminarLoteSupabase(id) {
        if(!confirm("⚠️ Acción Administrativa Crítica: Esta remoción provocará una alteración en la auditoría final y devolverá el volumen logístico al almacén.")) return;
        mostrarModalLocal("Reversión", "Liquidando lote y reestructurando Stock Maestro...");
        try {
            let { data: detalle } = await supabaseClient.from('detalle_ventas').select('*').eq('lote_id', id);
            if(detalle) {
                for(let d of detalle) {
                    let { data: cat } = await supabaseClient.from('catalogo').select('stock').eq('id', d.producto_id).single();
                    if(cat) {
                        let stockRestaurado = cat.stock + d.cantidad;
                        await supabaseClient.from('catalogo').update({ stock: stockRestaurado }).eq('id', d.producto_id);
                    }
                }
            }
            await supabaseClient.from('detalle_ventas').delete().eq('lote_id', id);
            await supabaseClient.from('control_inventario_cierres').delete().eq('lote_id', id);
            let { error } = await supabaseClient.from('lotes_diarios').delete().eq('id', id);
            if(error) throw error;

            cerrarModalGlobal(); alert("✅ Liquidación exitosa y retorno confirmado en almacén.");
            await cargarDatosServidor();
        } catch(e) { cerrarModalGlobal(); alert("❌ Detención crítica: " + e.message); }
    }

    function limpiarNombre(n) { return (n || "").replace(/box_-/g, "").trim(); }
    function formatearNumero(v, d = 2) {
        if (isNaN(v) || v === null || v === undefined) return "0";
        let num = parseFloat(v); if (d === 0) num = Math.round(num);
        let p = num.toFixed(d).split('.');
        p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return p.length > 1 ? p[0] + "," + p[1] : p[0];
    }
    function abrirModalGlobal(titulo, htmlContent) {
        document.getElementById('global_modal_title').innerText = titulo;
        document.getElementById('global_modal_body').innerHTML = htmlContent;
        document.getElementById('global_modal').style.display = 'flex';
    }
    function cerrarModalGlobal() { document.getElementById('global_modal').style.display = 'none'; }
    function mostrarModalLocal(titulo, msg) { abrirModalGlobal(titulo, `<div style="text-align:center; padding:20px; font-size:1.1rem; color:var(--primary); font-family:'Playfair Display', serif;">⏳ ${msg}</div>`); }
</script>
