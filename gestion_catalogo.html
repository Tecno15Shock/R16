<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Catálogo | Panel Ejecutivo</title>
    
    <!-- Librería Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Núcleo de Lógica y Arquitectura Visual -->
    <script src="motor.js"></script>
    <script src="plantilla_base.js"></script>
    
    <style>
        /* Ajustes ultra-premium complementarios integrados con plantilla_base.js */
        .badge-tipo {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-simple {
            background: rgba(46, 125, 50, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .badge-preparado {
            background: rgba(184, 134, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        .cost-tag {
            font-size: 0.82rem;
            color: #a0aec0;
            display: block;
        }
        .price-tag {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--active-gold);
        }
        .ing-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

<div class="wrapper" id="main_wrapper" style="display: none;">
    <main class="main-content">
        <h1 style="color: var(--active-gold); font-family: var(--title-font); text-transform: uppercase; text-align: center; border-bottom: 2px solid var(--active-gold); padding-bottom: 12px; margin-top: 0; letter-spacing: 1.5px;">
            📁 Gestión de Catálogo e Inventario
        </h1>

        <!-- 1. CATEGORÍAS -->
        <div>
            <div class="acordeon-header" onclick="UICatalogo.toggleSeccion('sec_categorias', 'icon_categorias')">
                <h2 class="acordeon-title">📁 1. Categorías de Productos</h2>
                <span id="icon_categorias" style="color: var(--active-gold); font-weight: bold;">▼</span>
            </div>
            <div id="sec_categorias" class="acordeon-content">
                <input type="hidden" id="edit_categoria_index" value="-1">
                <div class="grid-2" style="align-items: flex-end;">
                    <div>
                        <label>Nombre de la Categoría:</label>
                        <input type="text" id="nueva_categoria_input" placeholder="Ej: Bebidas, Víveres, Repostería">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" id="btn_guardar_categoria" onclick="UICatalogo.guardarCategoria()" class="btn-info">CREAR CATEGORÍA</button>
                        <button type="button" id="btn_cancelar_categoria" onclick="UICatalogo.cancelarEdicionCategoria()" class="btn-danger" style="display:none; width: auto;">Cancelar</button>
                    </div>
                </div>
                <div style="overflow-x: auto; margin-top: 15px;">
                    <table class="tabla-permisos" id="tabla_gestion_categorias"></table>
                </div>
            </div>
        </div>

        <!-- 2. REGISTRO Y EDICIÓN DE MERCANCÍA -->
        <div>
            <div class="acordeon-header" onclick="UICatalogo.toggleSeccion('sec_mercancia', 'icon_mercancia')">
                <h2 class="acordeon-title">📦 2. Registro y Edición de Productos</h2>
                <span id="icon_mercancia" style="color: var(--active-gold); font-weight: bold;">▼</span>
            </div>
            <div id="sec_mercancia" class="acordeon-content">
                <div class="switch-label" style="margin-bottom: 20px;">
                    <div>
                        <span style="opacity: 0.8;">MONEDA BASE PRINCIPAL DEL SISTEMA:</span>
                        <strong id="label_moneda_base_actual" style="color: var(--active-gold); font-size: 1.1rem; margin-left: 8px;">USD</strong>
                    </div>
                    <button type="button" onclick="UICatalogo.actualizarMonedaBaseUI()" class="btn-info" style="width: auto; margin: 0; padding: 6px 14px; font-size: 0.85rem;">🔄 Refrescar Moneda</button>
                </div>

                <input type="hidden" id="edit_prod_uuid" value="">
                
                <div style="margin-bottom: 15px;">
                    <label>Tipo de Referencia / Producto:</label>
                    <select id="form_prod_tipo" onchange="UICatalogo.alternarTipoProducto()">
                        <option value="simple">📦 Producto Unitario / Simple (Insumo o Mercancía Directa)</option>
                        <option value="preparado">☕ Producto Compuesto / Receta (Combo o Preparado)</option>
                    </select>
                </div>
                
                <div class="grid-2">
                    <div>
                        <label>Nombre Comercial / Referencia:</label>
                        <input type="text" id="form_prod_nom" placeholder="Mercancía">
                    </div>
                    <div>
                        <label>Categoría Asignada:</label>
                        <select id="form_prod_cat"></select>
                    </div>
                </div>
                
                <div class="grid-2">
                    <div>
                        <label>Moneda del Costo Fuente:</label>
                        <select id="form_prod_moneda"></select>
                    </div>
                    <div>
                        <label>Costo Fuente (A como me sale / Compra):</label>
                        <input type="number" step="0.01" id="form_prod_fuente" placeholder="0.00">
                    </div>
                </div>
                
                <div class="grid-2">
                    <div>
                        <label>Precio Base de Venta (A como lo vendo):</label>
                        <input type="number" step="0.01" id="form_prod_base" placeholder="0.00">
                    </div>
                    <div></div>
                </div>
                
                <div class="grid-2" id="contenedor_stock_directo">
                    <div>
                        <label>Unidad de Medida:</label>
                        <select id="form_prod_unidad">
                            <option value="Unidad">Unidad</option>
                            <option value="Gramo">Gramo</option>
                            <option value="Kilo">Kilo</option>
                            <option value="Mililitro">Mililitro</option>
                            <option value="Litro">Litro</option>
                            <option value="Ración">Ración</option>
                        </select>
                    </div>
                    <div>
                        <label>Stock Físico Actual:</label>
                        <input type="number" step="0.01" id="form_prod_stock" placeholder="0">
                    </div>
                </div>
                
                <div class="grid-2" id="contenedor_umbrales" style="margin-top:15px; padding: 15px; border: 1px solid var(--active-gold); background: var(--input-bg); border-radius: var(--border-radius);">
                    <div>
                        <label style="color:var(--warning); font-weight:bold;">⚠️ Alerta Amarilla (Stock Bajo):</label>
                        <input type="number" id="form_prod_u_amarillo" value="5">
                    </div>
                    <div>
                        <label style="color:var(--danger); font-weight:bold;">🚨 Alerta Roja (Stock Crítico):</label>
                        <input type="number" id="form_prod_u_rojo" value="0">
                    </div>
                </div>
                
                <!-- Receta / Ingredientes para Productos Compuestos -->
                <div id="contenedor_receta" style="display:none; margin-top: 15px; padding: 15px; border: 1px solid var(--active-gold); background: var(--input-bg); border-radius: var(--border-radius);">
                    <label style="color:var(--warning); font-weight:bold;">📋 Insumos e Ingredientes Requeridos por Unidad Producida</label>
                    <div id="ingredientes-container" style="margin-top: 10px;"></div>
                    <button type="button" class="btn-warning" onclick="UICatalogo.agregarFilaIngrediente()" style="margin-top: 15px; width: auto; font-size: 0.85rem;">+ AÑADIR INSUMO A LA RECETA</button>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="button" id="btn_guardar_producto" onclick="UICatalogo.guardarProductoSupabase()" class="btn-info">💾 CONSOLIDAR EN CATÁLOGO SUPABASE</button>
                    <button type="button" id="btn_cancelar_edit" onclick="UICatalogo.limpiarFormProducto()" class="btn-danger" style="display:none; width: auto;">CANCELAR EDICIÓN</button>
                </div>
            </div>
        </div>

        <!-- 3. HISTORIAL DE CATÁLOGO ACTUAL -->
        <div>
            <div class="acordeon-header" onclick="UICatalogo.toggleSeccion('sec_historial', 'icon_historial')">
                <h2 class="acordeon-title">📋 3. Historial de Catálogo Registrado</h2>
                <span id="icon_historial" style="color: var(--active-gold); font-weight: bold;">▼</span>
            </div>
            <div id="sec_historial" class="acordeon-content">
                <div class="grid-2" style="margin-bottom: 15px;">
                    <div>
                        <input type="text" id="buscar_gestion_prod" placeholder="🔍 Buscar por nombre o categoría..." oninput="UICatalogo.renderTablaGestionProductos()">
                    </div>
                    <div>
                        <select id="orden_gestion_prod" onchange="UICatalogo.renderTablaGestionProductos()">
                            <option value="az">🔤 Orden Alfabético (A-Z)</option>
                            <option value="cat">📁 Agrupar por Categoría</option>
                        </select>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="tabla-permisos" id="tabla_gestion_productos"></table>
                </div>
            </div>
        </div>

        <!-- 4. FONDO DE CAJA MANUAL -->
        <div>
            <div class="acordeon-header" onclick="UICatalogo.toggleSeccion('sec_caja', 'icon_caja')">
                <h2 class="acordeon-title">🏦 4. Parámetros de Fondo de Caja Inicial</h2>
                <span id="icon_caja" style="color: var(--active-gold); font-weight: bold;">▼</span>
            </div>
            <div id="sec_caja" class="acordeon-content">
                <div id="contenedor_fondo_caja_dinamico" class="grid-2"></div>
                <button type="button" onclick="UICatalogo.guardarFondoCaja()" class="btn-info" style="margin-top: 20px;">💾 GUARDAR PARÁMETROS DE FONDO EN CONFIGURACIÓN</button>
            </div>
        </div>
    </main>
</div>

<script>
    const UICatalogo = {
        catalogo: [],
        categorias: [],

        async init() {
            UIBase.mostrarCargando("INICIALIZANDO MÓDULO", "Verificando acceso y sincronizando catálogo con Supabase...");
            try {
                const estado = await AppMotor.inicializar();
                const conf = estado.configuracion || {};
                const permisos = conf.permisos_modulos || {};
                
                // Verificación de acceso al módulo según matriz de permisos
                const bloqueoGeneral = permisos.gestion_catalogo && permisos.gestion_catalogo.general;

                if (conf.identidad?.admin_pass && bloqueoGeneral) {
                    UIBase.ocultarCargando();
                    UIBase.bloquearPantallaPIN((pin) => {
                        const esCorrecto = AppMotor.verificarPinAdministrador(pin);
                        if (esCorrecto) {
                            document.getElementById('main_wrapper').style.display = 'block';
                            UICatalogo.cargarModulo(estado);
                        }
                        return esCorrecto;
                    });
                } else {
                    UIBase.ocultarCargando();
                    document.getElementById('main_wrapper').style.display = 'block';
                    this.cargarModulo(estado);
                }
            } catch (e) {
                UIBase.ocultarCargando();
                if (e.message === "NoAutorizado") {
                    window.location.href = 'index.html';
                } else {
                    alert("Error al inicializar el catálogo: " + e.message);
                }
            }
        },

        cargarModulo(estado) {
            const conf = estado.configuracion || {};
            const nombreLocal = estado.datosLocal?.nombre || conf?.identidad?.nombre || 'Sistema';
            UIBase.sincronizarNombreLocal(nombreLocal);

            // Sincronización de categorías
            this.categorias = (conf.categorias || []).sort((a, b) => a.localeCompare(b));

            // Sincronización de catálogo mapping
            this.catalogo = (estado.catalogo || []).map(p => ({
                uuid: p.id, 
                nom: p.nombre, 
                cat: p.categoria || "General", 
                tipo: p.tipo || "simple",
                base: p.precio_base || 0, // Precio de venta (A como lo vendo)
                mBase: p.moneda_base || 'USD',
                fuente: p.costo_fuente || 0, // Costo de compra (A como me sale)
                unidad: p.unidad || 'Unidad', 
                stock: p.stock || 0, 
                umbralAmarillo: p.umbral_amarillo || 5, 
                umbralRojo: p.umbral_rojo || 0, 
                receta: p.receta || []
            }));

            this.actualizarMonedaBaseUI();
            this.poblarSelectorMonedasProducto();
            this.renderFondoCajaDinamico();
            this.renderCategorias();
            this.renderTablaGestionProductos();
        },

        toggleSeccion(id, iconId) {
            const el = document.getElementById(id);
            const icon = document.getElementById(iconId);
            if (el.style.display === 'block') {
                el.style.display = 'none';
                if (icon) icon.innerText = '▼';
            } else {
                el.style.display = 'block';
                if (icon) icon.innerText = '▲';
            }
        },

        actualizarMonedaBaseUI() {
            const mb = AppMotor.estadoGlobal.sistemaMonetario?.moneda_base || 'USD';
            const el = document.getElementById('label_moneda_base_actual');
            if (el) el.innerText = mb;
        },

        poblarSelectorMonedasProducto() {
            const sm = AppMotor.estadoGlobal.sistemaMonetario || { moneda_base: 'USD', secundarias: [] };
            let lista = [sm.moneda_base];
            if (Array.isArray(sm.secundarias)) {
                sm.secundarias.forEach(s => {
                    const cod = typeof s === 'string' ? s : s.code;
                    if (cod && !lista.includes(cod)) lista.push(cod);
                });
            }
            const select = document.getElementById('form_prod_moneda');
            if (select) select.innerHTML = lista.map(m => `<option value="${m}">${m}</option>`).join('');
        },

        renderFondoCajaDinamico() {
            const sm = AppMotor.estadoGlobal.sistemaMonetario || { moneda_base: 'USD', secundarias: [] };
            let activas = [sm.moneda_base];
            if (Array.isArray(sm.secundarias)) {
                sm.secundarias.forEach(s => {
                    const cod = typeof s === 'string' ? s : s.code;
                    if (cod && !activas.includes(cod)) activas.push(cod);
                });
            }
            const cajaFondo = AppMotor.estadoGlobal.configuracion?.caja_fondo || {};
            let html = '';
            activas.forEach(mon => {
                const val = cajaFondo[mon.toLowerCase()] || 0;
                html += `<div><label>Fondo Inicial en ${mon}:</label><input type="number" step="0.01" id="caja_fondo_${mon.toLowerCase()}" value="${val}"></div>`;
            });
            document.getElementById('contenedor_fondo_caja_dinamico').innerHTML = html;
        },

        async guardarFondoCaja() {
            const sm = AppMotor.estadoGlobal.sistemaMonetario || { moneda_base: 'USD', secundarias: [] };
            let activas = [sm.moneda_base];
            if (Array.isArray(sm.secundarias)) {
                sm.secundarias.forEach(s => {
                    const cod = typeof s === 'string' ? s : s.code;
                    if (cod && !activas.includes(cod)) activas.push(cod);
                });
            }
            let fondo = {};
            activas.forEach(mon => {
                const inp = document.getElementById(`caja_fondo_${mon.toLowerCase()}`);
                fondo[mon.toLowerCase()] = inp ? parseFloat(inp.value) || 0 : 0;
            });

            UIBase.mostrarCargando("GUARDANDO", "Actualizando fondo de caja inicial en Supabase...");
            try {
                await AppMotor._guardarConfigParcial('caja_fondo', fondo);
                AppMotor.estadoGlobal.configuracion.caja_fondo = fondo;
                UIBase.ocultarCargando();
                alert("✅ Parámetros de fondo de caja guardados con éxito.");
            } catch(e) {
                UIBase.ocultarCargando();
                alert("Error al guardar fondo de caja: " + e.message);
            }
        },

        renderCategorias() {
            this.categorias.sort((a, b) => a.localeCompare(b));
            let html = "<thead><tr><th>Categoría</th><th style='text-align:center;'>Acción</th></tr></thead><tbody>";
            this.categorias.forEach((c, i) => {
                html += `<tr>
                    <td style="font-weight:bold; color:var(--active-gold);">${c}</td>
                    <td style="text-align:center;">
                        <button type="button" class="btn-info" style="padding:4px 10px; margin:0; width:auto; font-size:0.8rem;" onclick="UICatalogo.editarCategoria(${i})">✏️ EDITAR</button>
                        <button type="button" class="btn-danger" style="padding:4px 8px; margin:0; width:auto; font-size:0.8rem;" onclick="UICatalogo.eliminarCategoria(${i})">🗑️</button>
                    </td>
                </tr>`;
            });
            html += "</tbody>";
            document.getElementById('tabla_gestion_categorias').innerHTML = html;
            
            const selectCat = document.getElementById('form_prod_cat');
            if (selectCat) {
                selectCat.innerHTML = this.categorias.length 
                    ? this.categorias.map(c => `<option value="${c}">${c}</option>`).join('')
                    : `<option value="General">General</option>`;
            }
        },

        async guardarCategoria() {
            let n = document.getElementById('nueva_categoria_input').value.trim();
            let idx = parseInt(document.getElementById('edit_categoria_index').value);
            if (!n) return alert("El nombre de la categoría no puede estar vacío.");

            if (idx >= 0) {
                this.categorias[idx] = n;
            } else {
                if (this.categorias.includes(n)) return alert("La categoría ya se encuentra registrada.");
                this.categorias.push(n);
            }

            UIBase.mostrarCargando("GUARDANDO", "Sincronizando categorías en la base de datos...");
            try {
                await AppMotor._guardarConfigParcial('categorias', this.categorias);
                this.renderCategorias();
                this.cancelarEdicionCategoria();
                UIBase.ocultarCargando();
            } catch(e) {
                UIBase.ocultarCargando();
                alert("Error al guardar categoría: " + e.message);
            }
        },

        editarCategoria(i) {
            document.getElementById('nueva_categoria_input').value = this.categorias[i];
            document.getElementById('edit_categoria_index').value = i;
            document.getElementById('btn_guardar_categoria').innerText = "💾 CONFIRMAR CAMBIO";
            document.getElementById('btn_cancelar_categoria').style.display = "inline-block";
        },

        cancelarEdicionCategoria() {
            document.getElementById('nueva_categoria_input').value = '';
            document.getElementById('edit_categoria_index').value = "-1";
            document.getElementById('btn_guardar_categoria').innerText = "CREAR CATEGORÍA";
            document.getElementById('btn_cancelar_categoria').style.display = "none";
        },

        async eliminarCategoria(i) {
            if (!confirm(`¿Está seguro de borrar la categoría "${this.categorias[i]}"?`)) return;
            this.categorias.splice(i, 1);
            UIBase.mostrarCargando("ELIMINANDO", "Actualizando lista de categorías...");
            try {
                await AppMotor._guardarConfigParcial('categorias', this.categorias);
                this.renderCategorias();
                this.cancelarEdicionCategoria();
                UIBase.ocultarCargando();
            } catch(e) {
                UIBase.ocultarCargando();
                alert("Error al eliminar categoría: " + e.message);
            }
        },

        alternarTipoProducto() {
            let tipo = document.getElementById('form_prod_tipo').value;
            document.getElementById('contenedor_stock_directo').style.display = tipo === 'simple' ? 'grid' : 'none';
            document.getElementById('contenedor_umbrales').style.display = tipo === 'simple' ? 'grid' : 'none';
            document.getElementById('contenedor_receta').style.display = tipo === 'preparado' ? 'block' : 'none';
        },

        agregarFilaIngrediente() {
            let cont = document.getElementById('ingredientes-container');
            let rowId = 'ing_' + Date.now();
            let optCatalogo = this.catalogo.filter(p => p.tipo === 'simple').map(p => `<option value="${p.uuid}">${p.nom} (${p.unidad})</option>`).join('');
            if (!optCatalogo) return alert("Debe registrar primero productos simples / insumos en el catálogo para armar recetas.");
            
            cont.insertAdjacentHTML('beforeend', `
                <div id="${rowId}" class="ing-row">
                    <select class="ing_sel" style="flex:2; margin:0;">${optCatalogo}</select>
                    <input type="number" step="0.01" placeholder="Cantidad" class="ing_cant" style="flex:1; margin:0;">
                    <button type="button" class="btn-danger" style="margin:0; padding:8px 12px; width:auto;" onclick="document.getElementById('${rowId}').remove()">✕</button>
                </div>
            `);
        },

        async guardarProductoSupabase() {
            let nom = document.getElementById('form_prod_nom').value.trim();
            let cat = document.getElementById('form_prod_cat').value;
            if (!nom) return alert("El nombre comercial del producto es obligatorio.");

            let uuid = document.getElementById('edit_prod_uuid').value;
            let tipoProd = document.getElementById('form_prod_tipo').value;
            let recetaArr = [];

            if (tipoProd === 'preparado') {
                document.querySelectorAll('#ingredientes-container > div').forEach(row => {
                    let idIng = row.querySelector('.ing_sel').value;
                    let cantIng = parseFloat(row.querySelector('.ing_cant').value) || 0;
                    if (idIng && cantIng > 0) recetaArr.push({ uuid: idIng, cant: cantIng });
                });
            }

            let precioBaseVal = parseFloat(document.getElementById('form_prod_base').value) || 0; // A como lo vendo
            let costoFuenteVal = parseFloat(document.getElementById('form_prod_fuente').value) || 0; // A como me sale
            let monSeleccionada = document.getElementById('form_prod_moneda').value || 'USD';

            let payload = {
                local_id: AppMotor.estadoGlobal.local_id,
                nombre: nom,
                categoria: cat || "General",
                tipo: tipoProd,
                precio_base: precioBaseVal,
                costo_fuente: monSeleccionada,
                precio_base: precioBaseVal,
                moneda_base: monSeleccionada,
                costo_fuente: costoFuenteVal,
                stock: tipoProd === 'simple' ? (parseFloat(document.getElementById('form_prod_stock').value) || 0) : 0,
                unidad: document.getElementById('form_prod_unidad').value || 'Unidad',
                umbral_amarillo: parseFloat(document.getElementById('form_prod_u_amarillo').value) || 5,
                umbral_rojo: parseFloat(document.getElementById('form_prod_u_rojo').value) || 0,
                receta: recetaArr,
                activo: true
            };

            UIBase.mostrarCargando("GUARDANDO", "Consolidando referencia en la base de datos...");
            try {
                if (uuid) {
                    let { error } = await AppMotor.supabase.from('catalogo').update(payload).eq('id', uuid);
                    if (error) throw error;
                } else {
                    let { error } = await AppMotor.supabase.from('catalogo').insert([payload]);
                    if (error) throw error;
                }
                await AppMotor.sincronizarDatosMaestros();
                this.cargarModulo(AppMotor.estadoGlobal);
                this.limpiarFormProducto();
                UIBase.ocultarCargando();
                alert("✅ Producto consolidado con éxito en el catálogo.");
            } catch(err) {
                UIBase.ocultarCargando();
                alert("Error al consolidar producto: " + err.message);
            }
        },

        editarProducto(idx) {
            let p = this.catalogo[idx];
            document.getElementById('edit_prod_uuid').value = p.uuid || '';
            document.getElementById('form_prod_tipo').value = p.tipo || 'simple';
            this.alternarTipoProducto();
            
            document.getElementById('form_prod_nom').value = p.nom;
            document.getElementById('form_prod_cat').value = p.cat;
            document.getElementById('form_prod_moneda').value = p.mBase || 'USD';
            document.getElementById('form_prod_base').value = p.base;
            document.getElementById('form_prod_fuente').value = p.fuente;
            document.getElementById('form_prod_stock').value = p.stock;
            document.getElementById('form_prod_unidad').value = p.unidad || 'Unidad';
            document.getElementById('form_prod_u_amarillo').value = p.umbralAmarillo || 5;
            document.getElementById('form_prod_u_rojo').value = p.umbralRojo || 0;

            // Reconstrucción explícita de receta
            const contIng = document.getElementById('ingredientes-container');
            contIng.innerHTML = '';
            if (p.tipo === 'preparado' && Array.isArray(p.receta)) {
                p.receta.forEach(ing => {
                    this.agregarFilaIngrediente();
                    const ultimaFila = contIng.lastElementChild;
                    if (ultimaFila) {
                        ultimaFila.querySelector('.ing_sel').value = ing.uuid;
                        ultimaFila.querySelector('.ing_cant').value = ing.cant;
                    }
                });
            }

            document.getElementById('btn_guardar_producto').innerText = "💾 ACTUALIZAR REGISTRO";
            document.getElementById('btn_cancelar_edit').style.display = "inline-block";
            
            const secMercancia = document.getElementById('sec_mercancia');
            if (secMercancia.style.display !== "block") this.toggleSeccion('sec_mercancia', 'icon_mercancia');
            secMercancia.scrollIntoView({ behavior: 'smooth' });
        },

        limpiarFormProducto() {
            ['edit_prod_uuid','form_prod_nom','form_prod_base','form_prod_stock','form_prod_fuente'].forEach(id => {
                let el = document.getElementById(id);
                if (el) el.value = "";
            });
            document.getElementById('ingredientes-container').innerHTML = '';
            document.getElementById('btn_guardar_producto').innerText = "💾 CONSOLIDAR EN CATÁLOGO SUPABASE";
            document.getElementById('btn_cancelar_edit').style.display = "none";
            document.getElementById('form_prod_tipo').value = 'simple';
            this.alternarTipoProducto();
        },

        async eliminarProductoSupabase(uuid) {
            if (!confirm("⚠️ ¿Está seguro de remover permanentemente esta referencia del catálogo?")) return;
            UIBase.mostrarCargando("ELIMINANDO", "Eliminando registro de Supabase...");
            try {
                let { error } = await AppMotor.supabase.from('catalogo').delete().eq('id', uuid);
                if (error) throw error;
                await AppMotor.sincronizarDatosMaestros();
                this.cargarModulo(AppMotor.estadoGlobal);
                UIBase.ocultarCargando();
            } catch(err) {
                UIBase.ocultarCargando();
                alert("Error al eliminar referencia: " + err.message);
            }
        },

        renderTablaGestionProductos() {
            let ord = document.getElementById('orden_gestion_prod') ? document.getElementById('orden_gestion_prod').value : "az";
            let arr = [...this.catalogo];
            arr.sort((a,b) => ord === 'cat' ? a.cat.localeCompare(b.cat) || a.nom.localeCompare(b.nom) : a.nom.localeCompare(b.nom));
            let q = document.getElementById('buscar_gestion_prod') ? document.getElementById('buscar_gestion_prod').value.toLowerCase() : "";

            let html = `<thead>
                <tr>
                    <th>Referencia / Categoría</th>
                    <th>Costos</th>
                    <th style="text-align:center;">Stock</th>
                    <th style="text-align:center;">Acciones</th>
                </tr>
            </thead><tbody>`;

            arr.filter(p => p.nom.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)).forEach((p) => {
                let idxOriginal = this.catalogo.findIndex(x => x.uuid === p.uuid);
                let badgeClass = p.tipo === 'preparado' ? 'badge-preparado' : 'badge-simple';
                let tipoTxt = p.tipo === 'preparado' ? 'Receta' : 'Simple';

                html += `
                <tr>
                    <td>
                        <strong style="color:var(--text); font-size: 1rem;">${p.nom}</strong>
                        <span class="badge-tipo ${badgeClass}" style="margin-left: 6px;">${tipoTxt}</span>
                        <br>
                        <span style="font-size:0.85rem; color:var(--active-gold); opacity:0.9;">📁 ${p.cat}</span>
                    </td>
                    <td>
                        <span class="cost-tag">Precio Al Costo: ${p.mBase} ${p.fuente.toFixed(2)}</span>
                        <span class="price-tag">Precio de Venta: ${p.mBase} ${p.base.toFixed(2)}</span>
                    </td>
                    <td style="text-align:center; font-weight:bold; font-size:1.05rem;">
                        ${p.tipo === 'preparado' ? '∞' : `${p.stock} <small style='font-size:0.75rem;'>${p.unidad}</small>`}
                    </td>
                    <td style="text-align:center;">
                        <div style="display:flex; justify-content:center; gap:5px;">
                            <button type="button" class="btn-info" style="padding:5px 10px; font-size:0.8rem; width:auto;" onclick="UICatalogo.editarProducto(${idxOriginal})">✏️ EDITAR</button>
                            <button type="button" class="btn-danger" style="padding:5px 8px; font-size:0.8rem; width:auto;" onclick="UICatalogo.eliminarProductoSupabase('${p.uuid}')">🗑️</button>
                        </div>
                    </td>
                </tr>`;
            });
            html += "</tbody>";
            document.getElementById('tabla_gestion_productos').innerHTML = html;
        }
    };

    window.addEventListener('DOMContentLoaded', () => UICatalogo.init());
</script>
</body>
</html>
