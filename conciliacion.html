<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliación Unificada - Sistema Administrativo</title>

    <!-- Dependencias en orden estricto -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="motor.js"></script>
    <script src="plantilla_base.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        .badge-percent {
            background: rgba(212, 175, 55, 0.2);
            color: var(--active-gold);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-currency {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .summary-box {
            background: var(--item-bg);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: var(--border-radius);
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-card span.label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .summary-card span.value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            font-family: var(--title-font);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table.luxury-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        table.luxury-table th {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--active-gold);
            padding: 10px 12px;
            text-align: left;
            font-family: var(--title-font);
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        table.luxury-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text);
        }

        table.luxury-table tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .currency-selector-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            background: var(--item-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text);
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .box-edicion {
            background: var(--item-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="wrapper" id="main_wrapper" style="display: none;">

    <main class="main-content">

        <!-- 1. ACORDEÓN DE CREACIÓN (RECOGIDO / CERRADO POR DEFECTO) -->
        <div class="card" id="card_crear_conciliacion">
            <div class="card-header" onclick="UIBase.toggleAcordeon(this)">
                <h2>➕ 1. Crear Nueva Conciliación / Punto de Pago</h2>
                <span class="accordion-icon">▼</span>
            </div>
            <div class="card-body">
                <p style="font-size:0.85rem; color:var(--muted); margin-top:0; margin-bottom:15px;">
                    Defina las conciliaciones (Ej: <em>Punto Banesco, Biopago VTV, Pago Móvil Mercantil</em>) y su impuesto/comisión. Las transacciones se acumularán automáticamente desde la Caja Registradora.
                </p>

                <div class="grid-2">
                    <div>
                        <label>Nombre de la Conciliación:</label>
                        <input type="text" id="nuevo_nombre_conciliacion" placeholder="Ej: Punto Banesco Pos">
                    </div>
                    <div>
                        <label>Porcentaje de Comisión / Descuento (%):</label>
                        <input type="number" step="0.01" min="0" max="100" id="nuevo_porcentaje_conciliacion" placeholder="Ej: 1.50">
                    </div>
                </div>

                <!-- SELECCIÓN DE MONEDA FLEXIBLE -->
                <div class="currency-selector-group">
                    <label style="margin-top: 0;">Configuración de Moneda Aplicable:</label>

                    <label class="radio-option">
                        <input type="radio" name="radio_moneda_scope" value="BASE" checked onchange="UIConciliacion.alCambiarScopeMoneda()">
                        Moneda Principal Base (<span id="txt_moneda_base_nombre">USD</span>)
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="radio_moneda_scope" value="ESPECIFICA" onchange="UIConciliacion.alCambiarScopeMoneda()">
                        Moneda Específica Registrada
                    </label>

                    <select id="select_moneda_especifica" style="display: none; margin-left: 25px; width: calc(100% - 25px);">
                        <!-- Se llena dinámicamente -->
                    </select>

                    <label class="radio-option">
                        <input type="radio" name="radio_moneda_scope" value="TODAS" onchange="UIConciliacion.alCambiarScopeMoneda()">
                        🌐 Aplicar a Todas las Monedas
                    </label>
                </div>

                <button class="btn-info" onclick="UIConciliacion.crearNuevaConciliacion()" style="margin-top: 20px;">
                    💾 REGISTRAR Y GUARDAR CONCILIACIÓN
                </button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed var(--border); margin: 10px 0;">

        <!-- 2. CONTENEDOR DE CONCILIACIONES CREADAS (ORDENADAS ALFABÉTICAMENTE) -->
        <div id="contenedor_conciliaciones_lista" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Se inyectan dinámicamente en orden A-Z -->
        </div>

    </main>
</div>

<script>
    const UIConciliacion = {
        listaConciliaciones: [],
        monedaBase: 'USD',
        monedasSecundarias: [],

        init: async function() {
            try {
                const estado = await AppMotor.inicializar();
                
                const sistemaMonetario = estado.sistemaMonetario || {};
                this.monedaBase = sistemaMonetario.moneda_base || 'USD';
                this.monedasSecundarias = sistemaMonetario.secundarias || [];

                this.listaConciliaciones = AppMotor.obtenerConciliacionesRules();

                this.poblarSelectoresMonedas();
                this.renderizarConciliacionesOrdenadas();

                if (estado.configuracion?.identidad?.admin_pass) {
                    document.getElementById('pantalla_bloqueo_admin').style.display = 'flex';
                    document.getElementById('pantalla_bloqueo_admin').style.opacity = '1';
                } else {
                    document.getElementById('main_wrapper').style.display = 'block';
                }

                document.getElementById('loading_overlay').style.display = 'none';
            } catch (err) {
                if (err.message === "NoAutorizado") {
                    window.location.href = 'index.html';
                } else {
                    alert("Error al cargar Conciliaciones: " + err.message);
                }
            }
        },

        poblarSelectoresMonedas: function() {
            document.getElementById('txt_moneda_base_nombre').innerText = this.monedaBase;

            const selectEsp = document.getElementById('select_moneda_especifica');
            selectEsp.innerHTML = `<option value="${this.monedaBase}">${this.monedaBase} (Principal Base)</option>`;

            this.monedasSecundarias.forEach(sec => {
                const opt = document.createElement('option');
                opt.value = sec.code;
                opt.text = `${sec.code} (Tasa: ${sec.tasa})`;
                selectEsp.appendChild(opt);
            });
        },

        alCambiarScopeMoneda: function() {
            const selectedRadio = document.querySelector('input[name="radio_moneda_scope"]:checked').value;
            const selectEsp = document.getElementById('select_moneda_especifica');
            selectEsp.style.display = (selectedRadio === 'ESPECIFICA') ? 'block' : 'none';
        },

        crearNuevaConciliacion: async function() {
            const nombreInput = document.getElementById('nuevo_nombre_conciliacion');
            const porcentajeInput = document.getElementById('nuevo_porcentaje_conciliacion');
            const scopeRadio = document.querySelector('input[name="radio_moneda_scope"]:checked').value;
            const selectEsp = document.getElementById('select_moneda_especifica');

            const nombre = nombreInput.value.trim();
            const porcentaje = parseFloat(porcentajeInput.value) || 0;

            if (!nombre) return alert("⚠️ Escribe un nombre para la conciliación.");

            let monedaCodigo = this.monedaBase;
            if (scopeRadio === 'ESPECIFICA') monedaCodigo = selectEsp.value;
            else if (scopeRadio === 'TODAS') monedaCodigo = 'TODAS';

            const existe = this.listaConciliaciones.some(c => c.nombre.toLowerCase() === nombre.toLowerCase());
            if (existe) return alert(`⚠️ Ya existe una conciliación llamada "${nombre}".`);

            const nuevaConciliacion = {
                id: 'conc_' + Date.now(),
                nombre: nombre,
                porcentaje: porcentaje,
                monedaScope: scopeRadio,
                monedaCodigo: monedaCodigo,
                registros: []
            };

            this.listaConciliaciones.push(nuevaConciliacion);

            UIBase.mostrarModalLocal("Guardando", "Registrando nueva conciliación...");
            try {
                await AppMotor.actualizarConciliacionesRules(this.listaConciliaciones);
                
                nombreInput.value = '';
                porcentajeInput.value = '';
                document.querySelector('input[name="radio_moneda_scope"][value="BASE"]').checked = true;
                this.alCambiarScopeMoneda();

                UIBase.mostrarAnimacionGuardando("Conciliación Creada");
                this.renderizarConciliacionesOrdenadas();
            } catch (err) {
                UIBase.cerrarModalGlobal();
                alert("❌ Error al guardar: " + err.message);
            }
        },

        renderizarConciliacionesOrdenadas: function() {
            const cont = document.getElementById('contenedor_conciliaciones_lista');
            cont.innerHTML = '';

            if (this.listaConciliaciones.length === 0) {
                cont.innerHTML = `<div class="card" style="padding: 25px; text-align: center; color: var(--muted); font-style: italic;">No hay conciliaciones registradas.</div>`;
                return;
            }

            // Ordenamiento A-Z
            const listaOrdenada = [...this.listaConciliaciones].sort((a, b) => 
                a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
            );

            listaOrdenada.forEach(conc => {
                const totalMonto = conc.registros.reduce((acc, r) => acc + (parseFloat(r.monto) || 0), 0);
                const totalComision = totalMonto * (conc.porcentaje / 100);
                const totalNeto = totalMonto - totalComision;

                const cardHtml = document.createElement('div');
                cardHtml.className = 'card';
                cardHtml.id = `card_${conc.id}`;

                let opcionesMonedaHtml = `<option value="${this.monedaBase}" ${conc.monedaCodigo === this.monedaBase ? 'selected' : ''}>Base (${this.monedaBase})</option>`;
                opcionesMonedaHtml += `<option value="TODAS" ${conc.monedaCodigo === 'TODAS' ? 'selected' : ''}>🌐 TODAS</option>`;
                this.monedasSecundarias.forEach(m => {
                    opcionesMonedaHtml += `<option value="${m.code}" ${conc.monedaCodigo === m.code ? 'selected' : ''}>${m.code}</option>`;
                });

                cardHtml.innerHTML = `
                    <div class="card-header" onclick="UIBase.toggleAcordeon(this)">
                        <h2>
                            💳 ${conc.nombre} 
                            <span class="badge-percent">% ${conc.porcentaje.toFixed(2)}</span>
                            <span class="badge-currency">Moneda: ${conc.monedaCodigo}</span>
                        </h2>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="card-body">
                        
                        <!-- RESUMEN ACUMULADO DESDE CAJA -->
                        <div class="summary-box">
                            <div class="summary-card">
                                <span class="label">Total Acumulado en Caja</span>
                                <span class="value">${totalMonto.toFixed(2)} ${conc.monedaCodigo}</span>
                            </div>
                            <div class="summary-card">
                                <span class="label">Comisión estimada (${conc.porcentaje}%)</span>
                                <span class="value" style="color: var(--danger);">- ${totalComision.toFixed(2)}</span>
                            </div>
                            <div class="summary-card">
                                <span class="label">Monto Neto Real</span>
                                <span class="value" style="color: var(--success);">${totalNeto.toFixed(2)} ${conc.monedaCodigo}</span>
                            </div>
                            <div class="summary-card">
                                <span class="label">N° Transacciones</span>
                                <span class="value">${conc.registros.length}</span>
                            </div>
                        </div>

                        <!-- EDICIÓN DE REGLAS DE LA CONCILIACIÓN -->
                        <div class="box-edicion">
                            <label style="margin-top:0;">✏️ Editar Parámetros de la Conciliación:</label>
                            <div class="grid-3" style="margin-top: 10px;">
                                <div>
                                    <label>Nombre:</label>
                                    <input type="text" id="edit_nombre_${conc.id}" value="${conc.nombre}">
                                </div>
                                <div>
                                    <label>Comisión (%):</label>
                                    <input type="number" step="0.01" id="edit_porcentaje_${conc.id}" value="${conc.porcentaje}">
                                </div>
                                <div>
                                    <label>Moneda:</label>
                                    <select id="edit_moneda_${conc.id}">${opcionesMonedaHtml}</select>
                                </div>
                            </div>
                            <button class="btn-info" style="margin-top: 12px;" onclick="UIConciliacion.guardarEdicion('${conc.id}')">
                                💾 GUARDAR REGLAS DE CONCILIACIÓN
                            </button>
                        </div>

                        <!-- TABLA DE AUDITORÍA HISTÓRICA DE CAJA -->
                        <label>Historial Acumulado (Ventas y Cierres de Caja):</label>
                        <div class="table-responsive">
                            <table class="luxury-table">
                                <thead>
                                    <tr>
                                        <th>Fecha / Hora</th>
                                        <th>Referencia / Ticket</th>
                                        <th>Monto Bruto</th>
                                        <th>Comisión (${conc.porcentaje}%)</th>
                                        <th>Monto Neto</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${this.generarFilasTabla(conc)}
                                </tbody>
                            </table>
                        </div>

                        <div class="grid-2" style="margin-top: 25px;">
                            <button class="btn-info" onclick="UIConciliacion.vaciarHistorial('${conc.id}')">
                                🧹 Vaciar Registros Acumulados
                            </button>
                            <button class="btn-danger" onclick="UIConciliacion.eliminarConciliacion('${conc.id}')">
                                🗑️ ELIMINAR CONCILIACIÓN COMPLETA
                            </button>
                        </div>

                    </div>
                `;

                cont.appendChild(cardHtml);
            });
        },

        generarFilasTabla: function(conciliacion) {
            if (!conciliacion.registros || conciliacion.registros.length === 0) {
                return `<tr><td colspan="6" style="text-align:center; color:var(--muted); font-style:italic;">No hay transacciones acumuladas desde caja.</td></tr>`;
            }

            return conciliacion.registros.map((reg, index) => {
                const monto = parseFloat(reg.monto) || 0;
                const comision = monto * (conciliacion.porcentaje / 100);
                const neto = monto - comision;

                return `
                    <tr>
                        <td>${reg.fecha || 'N/A'}</td>
                        <td><strong>${reg.referencia || 'SIN REF'}</strong></td>
                        <td>${monto.toFixed(2)} ${conciliacion.monedaCodigo}</td>
                        <td style="color:var(--danger);">- ${comision.toFixed(2)}</td>
                        <td style="color:var(--success); font-weight:bold;">${neto.toFixed(2)}</td>
                        <td>
                            <button class="btn-danger" style="padding:4px 8px; margin:0; font-size:0.75rem;" onclick="UIConciliacion.eliminarRegistroIndividual('${conciliacion.id}', ${index})">
                                ✕
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        },

        guardarEdicion: async function(concId) {
            const conc = this.listaConciliaciones.find(c => c.id === concId);
            if (!conc) return;

            const nuevoNombre = document.getElementById(`edit_nombre_${concId}`).value.trim();
            const nuevoPorcentaje = parseFloat(document.getElementById(`edit_porcentaje_${concId}`).value) || 0;
            const nuevaMoneda = document.getElementById(`edit_moneda_${concId}`).value;

            if (!nuevoNombre) return alert("⚠️ El nombre no puede estar vacío.");

            conc.nombre = nuevoNombre;
            conc.porcentaje = nuevoPorcentaje;
            conc.monedaCodigo = nuevaMoneda;

            UIBase.mostrarModalLocal("Guardando", "Actualizando parámetros...");
            try {
                await AppMotor.actualizarConciliacionesRules(this.listaConciliaciones);
                UIBase.mostrarAnimacionGuardando("Conciliación Actualizada");
                this.renderizarConciliacionesOrdenadas();
                document.getElementById(`card_${concId}`)?.classList.add('open');
            } catch (err) {
                UIBase.cerrarModalGlobal();
                alert("❌ Error: " + err.message);
            }
        },

        eliminarRegistroIndividual: async function(concId, index) {
            const conc = this.listaConciliaciones.find(c => c.id === concId);
            if (!conc) return;

            conc.registros.splice(index, 1);
            UIBase.mostrarModalLocal("Actualizando", "Eliminando registro de caja...");
            try {
                await AppMotor.actualizarConciliacionesRules(this.listaConciliaciones);
                UIBase.mostrarAnimacionGuardando("Registro Eliminado");
                this.renderizarConciliacionesOrdenadas();
                document.getElementById(`card_${concId}`)?.classList.add('open');
            } catch (err) {
                UIBase.cerrarModalGlobal();
                alert("❌ Error: " + err.message);
            }
        },

        vaciarHistorial: async function(concId) {
            const conc = this.listaConciliaciones.find(c => c.id === concId);
            if (!conc) return;

            if (!confirm(`¿Vaciar todo el historial acumulado de "${conc.nombre}"?`)) return;

            conc.registros = [];
            UIBase.mostrarModalLocal("Limpiando", "Vaciando historial...");
            try {
                await AppMotor.actualizarConciliacionesRules(this.listaConciliaciones);
                UIBase.mostrarAnimacionGuardando("Historial Vaciado");
                this.renderizarConciliacionesOrdenadas();
                document.getElementById(`card_${concId}`)?.classList.add('open');
            } catch (err) {
                UIBase.cerrarModalGlobal();
                alert("❌ Error: " + err.message);
            }
        },

        eliminarConciliacion: async function(concId) {
            const conc = this.listaConciliaciones.find(c => c.id === concId);
            if (!conc) return;

            if (!confirm(`⚠️ ¿Desea eliminar completamente "${conc.nombre}"?`)) return;

            this.listaConciliaciones = this.listaConciliaciones.filter(c => c.id !== concId);
            UIBase.mostrarModalLocal("Eliminando", "Actualizando base de datos...");
            try {
                await AppMotor.actualizarConciliacionesRules(this.listaConciliaciones);
                UIBase.mostrarAnimacionGuardando("Conciliación Eliminada");
                this.renderizarConciliacionesOrdenadas();
            } catch (err) {
                UIBase.cerrarModalGlobal();
                alert("❌ Error: " + err.message);
            }
        }
    };

    window.addEventListener('DOMContentLoaded', () => UIConciliacion.init());
</script>
</body>
</html>
